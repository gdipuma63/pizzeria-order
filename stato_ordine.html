<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stato Ordine - Pizzeria</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f1e7; padding: 20px; text-align: center; color: #4b3621; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border: 2px solid #ff9800; }
        .box { margin: 20px 0; padding: 25px; border: 1px solid #eee; border-radius: 15px; background: #fffcf9; }
        .btn { padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; margin: 8px; color: white; font-weight: bold; font-size: 16px; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        .btn-conferma { background-color: #27ae60; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
        .btn-annulla { background-color: #e74c3c; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); }
        
        .pronto-animation {
            font-size: 22px;
            font-weight: 800;
            color: #27ae60;
            animation: pulse-ready 1.5s infinite;
            padding: 15px;
            border: 2px dashed #27ae60;
            border-radius: 10px;
            background: #f0fff4;
            margin-top: 15px;
        }

        @keyframes pulse-ready {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .orario-label { font-size: 18px; color: #d35400; margin: 10px 0; }
        .stato-label { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1 style="margin-top: 0;">🍕 La Tua Pizza</h1>
    <div id="contenuto" class="box">
        <p>Connessione al forno in corso...</p>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://gestioneordini-25dba-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    if (!orderId) {
        document.getElementById("contenuto").innerHTML = "⚠️ Inserisci un ID ordine valido.";
    } else {
        db.ref(`ordini/${orderId}`).on('value', (snapshot) => {
            const data = snapshot.val();
            const contenuto = document.getElementById("contenuto");

            if (!data) { 
                contenuto.innerHTML = "❌ Ordine non trovato."; 
                return; 
            }

            let html = `<div class="stato-label">Stato attuale</div>`;
            html += `<h2 style="margin: 0 0 20px 0; color: #ff9800;">${data.stato || 'Ricevuto'}</h2>`;

            // MOSTRA ORARIO SOLO SE NON È PRONTO
            if (data.orario_previsto && data.stato !== "Pronto") {
                html += `<p class="orario-label">🕒 Orario stimato: <b>${data.orario_previsto}</b></p>`;
            }

            // LOGICA DIALOGO E STATI DINAMICI
            if (!data.stato || data.stato === "Ricevuto") {
                html += `<p>Ordine ricevuto! La pizzeria sta elaborando la richiesta.</p>`;
            } else if (data.stato === "In attesa conferma" && !data.conferma_cliente) {
                html += `
                    <div style="background: #fff3cd; padding: 15px; border-radius: 10px; margin-top: 10px;">
                        <p><b>Confermi l'ordine?</b></p>
                        <button class="btn btn-conferma" onclick="rispondi(true)">SI, CONFERMO</button>
                        <button class="btn btn-annulla" onclick="rispondi(false)">ANNULLA</button>
                    </div>
                `;
            } else if (data.stato === "Ordine Inserito") {
                html += `<p style="color: #27ae60; font-weight: bold;">✅ Conferma ricevuta! Sei in lista.</p>`;
            } else if (data.stato === "In Preparazione") {
                html += `<p style="color: #d35400; font-weight: bold;">🔥 Le tue pizze sono in forno!</p>`;
            } else if (data.stato === "Pronto") {
                if (!data.conferma_finale) {
                    let messaggioPronto = (data.modalita === "Ritiro") 
                        ? "🍕 IL TUO ORDINE È PRONTO!<br><small>Ti aspettiamo in pizzeria.</small>" 
                        : "🛵 IL TUO ORDINE È IN CONSEGNA!<br><small>Il fattorino è in arrivo.</small>";
                    
                    let etichettaPulsante = (data.modalita === "Ritiro") ? "Provvedo al ritiro" : "Attendo consegna";
                    
                    html += `
                        <div class="pronto-animation">${messaggioPronto}</div>
                        <button class="btn btn-conferma" onclick="confermaConclusione()">
                            ${etichettaPulsante}
                        </button>
                    `;
                } else {
                    html += `
                        <div class="pronto-animation">GRAZIE DI CUORE!</div>
                        <p>Ti auguriamo buon appetito.</p>
                        <p>Verrai reindirizzato alla Home tra pochi secondi...</p>
                    `;
                    setTimeout(() => { window.location.href = "index.html"; }, 5000);
                }
            } else if (data.stato === "Annullato") {
                html += `<p style="color: #c0392b;">❌ Ordine annullato.</p>`;
            }

            contenuto.innerHTML = html;
        });
    }

    function rispondi(accettato) {
        if (accettato) {
            db.ref(`ordini/${orderId}`).update({ conferma_cliente: true, stato: "Ordine Inserito" });
        } else {
            if (confirm("Vuoi davvero annullare l'ordine?")) {
                db.ref(`ordini/${orderId}`).update({ stato: "Annullato" });
                setTimeout(() => { window.location.href = "index.html"; }, 2000);
            }
        }
    }

    function confermaConclusione() {
        db.ref(`ordini/${orderId}`).update({ conferma_finale: true });
    }
</script>

</body>
</html>
