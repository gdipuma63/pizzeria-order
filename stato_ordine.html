<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stato Ordine - Pizzeria</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .box { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; color: white; }
        .btn-conferma { background-color: #28a745; }
        .btn-annulla { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Il tuo ordine</h1>
    <div id="contenuto" class="box">Caricamento in corso...</div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');
    const dbUrl = `https://gestioneordini-25dba-default-rtdb.europe-west1.firebasedatabase.app/ordini/${orderId}.json`;

    function caricaOrdine() {
        fetch(dbUrl)
            .then(res => res.json())
            .then(data => {
                if (!data) { document.getElementById("contenuto").innerHTML = "Ordine non trovato."; return; }

                let html = `<p>Stato attuale: <b>${data.stato}</b></p>`;

                // 1. Stato: In attesa di conferma tempo dalla pizzeria
                if (data.stato === "Ricevuto" && data.tempo_attesa && !data.conferma_cliente) {
                    html += `
                        <p>La pizzeria stima: <b>${data.tempo_attesa} minuti</b>.</p>
                        <button class="btn btn-conferma" onclick="rispondi(true)">Accetta e Conferma</button>
                        <button class="btn btn-annulla" onclick="rispondi(false)">Rifiuta</button>
                    `;
                } 
                // 2. Stato: Ordine confermato e in turno
                else if (data.conferma_cliente === true && data.stato !== "In Preparazione") {
                    html += `
                        <p style="color: #28a745; font-weight: bold;">✅ Ordine confermato! Attendi ora il tuo turno.</p>
                        <button class="btn btn-annulla" onclick="annullaOrdine()">Annulla Ordine</button>
                    `;
                }
                // 3. Stato: Lockdown (In Preparazione)
                else if (data.stato === "In Preparazione") {
                    html += `<p style="color: #666;">⚠️ In preparazione: annullamento non più possibile.</p>`;
                }
                else {
                    html += `<p>In attesa di risposta dalla pizzeria...</p>`;
                }

                document.getElementById("contenuto").innerHTML = html;
            });
    }

    // Funzione per accettare o rifiutare
    function rispondi(accettato) {
        if (accettato) {
            fetch(dbUrl, { method: 'PATCH', body: JSON.stringify({ conferma_cliente: true, stato: "Ordine Inserito" }) })
                .then(() => caricaOrdine());
        } else {
            // Se rifiuta, eliminiamo l'ordine dal database
            fetch(dbUrl, { method: 'DELETE' }).then(() => {
                alert("Ordine eliminato.");
                window.location.href = "index.html";
            });
        }
    }

    // Funzione per annullare dopo la conferma
    function annullaOrdine() {
        if (confirm("Sei sicuro di voler annullare l'ordine?")) {
            fetch(dbUrl, { method: 'DELETE' }).then(() => {
                alert("Ordine annullato.");
                window.location.href = "index.html";
            });
        }
    }

    caricaOrdine();
    // Aggiornamento automatico ogni 5 secondi per vedere il cambio stato operatore
    setInterval(caricaOrdine, 5000);
</script>

</body>
</html>
