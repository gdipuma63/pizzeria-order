<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stato Ordine - Pizzeria</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; text-align: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .box { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin: 5px; color: white; font-weight: bold; }
        .btn-conferma { background-color: #28a745; }
        .btn-annulla { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>Il tuo ordine</h1>
    <div id="contenuto" class="box">Caricamento in corso...</div>
</div>

<script>
    // Configurazione Firebase
    const firebaseConfig = {
        databaseURL: "https://gestioneordini-25dba-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get('id');

    if (!orderId) {
        document.getElementById("contenuto").innerHTML = "Errore: Ordine non specificato.";
    } else {
        // Ascolto in tempo reale (Live)
        db.ref(`ordini/${orderId}`).on('value', (snapshot) => {
            const data = snapshot.val();
            const contenuto = document.getElementById("contenuto");

            if (!data) { 
                contenuto.innerHTML = "Ordine non trovato."; 
                return; 
            }

            let html = `<p>Stato attuale: <b>${data.stato}</b></p>`;
            if (data.orario_previsto) {
                html += `<p>Orario previsto: <b>${data.orario_previsto}</b></p>`;
            }

            // Logica di dialogo
            if (data.stato === "In attesa conferma" && !data.conferma_cliente) {
                html += `
                    <p>La pizzeria propone questo orario. Confermi?</p>
                    <button class="btn btn-conferma" onclick="rispondi(true)">Accetta</button>
                    <button class="btn btn-annulla" onclick="rispondi(false)">Rifiuta</button>
                `;
            } else if (data.stato === "Ordine Inserito") {
                html += `<p style="color: #28a745;">✅ Ordine confermato! In lavorazione.</p>`;
            } else if (data.stato === "In Preparazione") {
                html += `<p style="color: #e67e22;">🔥 Pizze in forno!</p>`;
            } else if (data.stato === "Pronto") {
                html += `<p style="color: #27ae60;">🔔 Il tuo ordine è pronto!</p>`;
            }

            contenuto.innerHTML = html;
        });
    }

    function rispondi(accettato) {
        if (accettato) {
            db.ref(`ordini/${orderId}`).update({ 
                conferma_cliente: true, 
                stato: "Ordine Inserito" 
            });
        } else {
            if (confirm("Vuoi annullare l'ordine?")) {
                db.ref(`ordini/${orderId}`).remove();
                window.location.href = "index.html";
            }
        }
    }
</script>

</body>
</html>
