<!DOCTYPE html>
<html lang="it">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Ordini</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f1e7; padding: 20px; color: #4b3621; }
        .container { max-width: 600px; margin: auto; }
        h1 { color: #4b3621; text-align: center; margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; }
        
        .ordine-card { 
            background: white; padding: 20px; margin-bottom: 20px; border-radius: 20px; 
            border: 1px solid #e0d5c1; box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
        }
        
        .dettaglio-contenuto { display: none; margin-top: 15px; padding: 15px; background: #faf9f6; border-radius: 15px; border: 1px solid #f0e6d2; }
        
        .stato-badge { font-weight: bold; padding: 5px 12px; border-radius: 15px; font-size: 11px; text-transform: uppercase; }
        .Ricevuto { background: #fff8e1; }
        .In-attesa-conferma { background: #ffe0b2; }
        .Ordine-Inserito { background: #c8e6c9; }
        .In-Preparazione { background: #bbdefb; }
        .In-Cottura { background: #ffecb3; }
        .Pronto { background: #b9f6ca; }
        
        /* Stile Chips */
        button { 
            padding: 7px 16px; border: 1px solid #e0d5c1; border-radius: 50px; cursor: pointer; 
            font-size: 13px; font-weight: 600; margin: 3px; transition: 0.3s;
            background-color: white; color: #4b3621;
        }
        button:hover { background-color: #ff9800; color: white; border-color: #ff9800; }
        
        .btn-azione { background-color: #ff9800; color: white; border-color: #ff9800; }
        .btn-toggle { background-color: #4b3621; color: white; border-radius: 50px; }
        .btn-elimina { background-color: #fff0f0; color: #d32f2f; border-color: #d32f2f; }
        
        input { padding: 7px 12px; border-radius: 50px; border: 1px solid #dcdcdc; width: 60px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Gestione Ordini</h1>
    <div id="listaOrdini"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestioneordini-25dba-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Funzione per formattare le iniziali maiuscole
    function formattaNome(nome) {
        if (!nome) return 'Cliente';
        return nome.toLowerCase().split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    db.ref('ordini').on('value', snapshot => {
        const container = document.getElementById('listaOrdini');
        container.innerHTML = '';
        
        snapshot.forEach(child => {
            const id = child.key;
            const o = child.val();
            const statoDisplay = o.stato || "Ricevuto";
            const classeStato = statoDisplay.replace(/\s+/g, '-');
            const nomeCliente = formattaNome(o.cliente);
            
            let listaPizze = "";
            if (o.pizze) {
                o.pizze.forEach(p => { listaPizze += `<li>${p.quantita}x ${p.pizza} (${p.formato})</li>`; });
            }

            const card = document.createElement('div');
            card.className = 'ordine-card';
            card.innerHTML = `
                <h3 style="margin-top:0; color: #ff9800;">${nomeCliente}</h3>
                <p style="margin: 5px 0; font-size: 0.9em;">📞 Tel: ${o.telefono || 'N/D'} | 🏠 ${o.modalita || 'N/A'}</p>
                <div style="margin: 10px 0;">Stato: <span class="stato-badge ${classeStato}">${statoDisplay}</span> | 🕒 <b>${o.orario_previsto || 'In attesa'}</b></div>

                <div style="border-top:1px solid #f0e6d2; padding-top:10px; margin-top:10px;">
                    <p style="text-align:center; font-size: 11px; color:#888; margin-bottom:8px;">IMPOSTA TEMPO DI ATTESA</p>
                    <div style="text-align:center;">
                        <input type="number" id="minuti_${id}" placeholder="Min">
                        <button class="btn-azione" onclick="confermaOrario('${id}', ${o.timestamp_conferma || Date.now()})">Imposta</button>
                    </div>
                </div>

                <div style="border-top:1px solid #f0e6d2; padding-top:10px; margin-top:10px;">
                    <p style="text-align:center; font-size: 11px; color:#888; margin-bottom:8px;">CAMBIA STATO ORDINE</p>
                    <div style="text-align:center;">
                        <button onclick="aggiornaStato('${id}', 'In Preparazione')">Prep.</button>
                        <button onclick="aggiornaStato('${id}', 'In Cottura')">Cottura</button>
                        <button class="btn-azione" onclick="aggiornaStato('${id}', 'Pronto')">PRONTO</button>
                    </div>
                </div>

                <div style="border-top:1px solid #f0e6d2; padding-top:10px; margin-top:10px; text-align:center;">
                    <button class="btn-toggle" onclick="toggleDettaglio('${id}')">DETTAGLIO ORDINE</button>
                    <div id="dettaglio_${id}" class="dettaglio-contenuto">
                        <ul style="text-align:left; font-size:14px;">${listaPizze}</ul>
                    </div>
                </div>

                <div style="text-align:center; margin-top:20px; border-top: 1px solid #eee; padding-top:15px;">
                    <button class="btn-elimina" onclick="eliminaOrdine('${id}')">Elimina Ordine</button>
                </div>
            `;
            container.appendChild(card);
        });
    });

    function toggleDettaglio(id) {
        const div = document.getElementById(`dettaglio_${id}`);
        div.style.display = (div.style.display === "block") ? "none" : "block";
    }

    function confermaOrario(id, timestampConferma) {
        const minuti = document.getElementById(`minuti_${id}`).value;
        if (!minuti) return alert("Inserisci i minuti!");
        const dataConsegna = new Date(timestampConferma + (minuti * 60000));
        const orario = dataConsegna.getHours() + ":" + dataConsegna.getMinutes().toString().padStart(2, '0');
        db.ref(`ordini/${id}`).update({ tempo_attesa: minuti, orario_previsto: orario, stato: "In attesa conferma" });
    }

    function aggiornaStato(id, nuovoStato) { db.ref(`ordini/${id}`).update({ stato: nuovoStato }); }

    function eliminaOrdine(id) {
        if (confirm("Vuoi davvero eliminare questo ordine?")) { db.ref(`ordini/${id}`).remove(); }
    }
</script>
</body>
</html>
