<!DOCTYPE html>
<html lang="it">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Pizzeria</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f1e7; padding: 20px; color: #4b3621; }
        .container { max-width: 800px; margin: auto; }
        h1 { color: #ff9800; text-align: center; }
        
        .ordine-card { 
            background: white; 
            padding: 20px; 
            margin-bottom: 20px; 
            border-radius: 15px; 
            border: 2px solid #ff9800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        
        .stato-badge { font-weight: bold; padding: 5px 10px; border-radius: 5px; display: inline-block; font-size: 12px; text-transform: uppercase; }
        
        /* Colori badge coordinati */
        .Ricevuto { background: #ffeeba; }
        .In-attesa-conferma { background: #ffcc80; }
        .Ordine-Inserito { background: #c8e6c9; }
        .In-Preparazione { background: #b8daff; }
        .In-Cottura { background: #ffc107; }
        .Pronto { background: #c3e6cb; }
        
        button { 
            padding: 10px 15px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            margin: 5px 2px;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.03); }
        .btn-azione { background-color: #ff9800; color: white; }
        .btn-elimina { background-color: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>👨‍🍳 Centro di Comando Pizzeria</h1>
    <div id="listaOrdini"></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://gestioneordini-25dba-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('ordini').on('value', snapshot => {
        const container = document.getElementById('listaOrdini');
        container.innerHTML = '';
        
        snapshot.forEach(child => {
            const id = child.key;
            const o = child.val();
            const statoDisplay = o.stato || "Ricevuto";
            const classeStato = statoDisplay.replace(/\s+/g, '-');
            
            const card = document.createElement('div');
            card.className = 'ordine-card';
            card.innerHTML = `
                <h3>${o.cliente || 'Cliente'} (${o.modalita || 'N/A'})</h3>
                <p>📞 Tel: ${o.telefono || 'N/D'}</p>
                <p>Stato: <span class="stato-badge ${classeStato}">${statoDisplay}</span></p>
                <p>🕒 Orario previsto: <b>${o.orario_previsto || 'Da definire'}</b></p>
                
                <hr>
                <input type="number" id="minuti_${id}" placeholder="Minuti" style="padding: 8px; width: 60px; border-radius: 5px; border: 1px solid #ccc;">
                <button class="btn-azione" onclick="confermaOrario('${id}', ${o.timestamp_conferma || Date.now()})">Imposta Orario</button>
                <div style="margin-top: 10px;">
                    <button onclick="aggiornaStato('${id}', 'In Preparazione')">Preparazione</button>
                    <button onclick="aggiornaStato('${id}', 'In Cottura')">In Cottura</button>
                    <button class="btn-azione" onclick="aggiornaStato('${id}', 'Pronto')">PRONTO</button>
                    <button class="btn-elimina" onclick="eliminaOrdine('${id}')">Elimina</button>
                </div>
            `;
            container.appendChild(card);
        });
    });

    function confermaOrario(id, timestampConferma) {
        const minuti = document.getElementById(`minuti_${id}`).value;
        if (!minuti) return alert("Inserisci i minuti!");
        const dataConsegna = new Date(timestampConferma + (minuti * 60000));
        const orario = dataConsegna.getHours() + ":" + dataConsegna.getMinutes().toString().padStart(2, '0');
        db.ref(`ordini/${id}`).update({ tempo_attesa: minuti, orario_previsto: orario, stato: "In attesa conferma" });
    }

    function aggiornaStato(id, nuovoStato) { db.ref(`ordini/${id}`).update({ stato: nuovoStato }); }

    function eliminaOrdine(id) {
        if (confirm("Vuoi davvero eliminare questo ordine?")) { db.ref(`ordini/${id}`).remove(); }
    }
</script>
</body>
</html>
