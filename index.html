<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

label{
display:block;
margin-top:14px;
margin-bottom:8px;
font-weight:600;
color:#4b3621;
}

button{cursor:pointer;}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
padding:12px;
border-radius:8px;
}

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
font-size:12px;
}

.modalita-box{display:flex;gap:10px;margin-top:10px;}

.modalita-btn{
flex:1;
background:#f1f1f1;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
}

.modalita-btn.active{
background:#4b3621;
color:white;
}

#listaPizze{
max-height:320px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:12px;
margin-top:10px;
}

.pizza-item{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:white;
}

.pizza-item:hover{background:#f8f8f8;}

.pizza-item.active{
background:#e8f0fe;
border-left:4px solid #1a73e8;
}

.pizza-nome{font-weight:bold;color:#4b3621;}

.pizza-prezzo{color:#1a73e8;font-weight:bold;}

.pizza-ingredienti{
font-size:13px;
color:#666;
margin:4px 0;
}

.chip{
padding:6px 10px;
border:1px solid #ccc;
border-radius:20px;
display:inline-block;
margin:3px;
cursor:pointer;
font-size:13px;
}

.chip.active{
background:#4b3621;
color:white;
}

.aggiunte-box{
background:#f7f7f7;
padding:10px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

#previewOrdine{
margin-top:15px;
padding:12px;
background:#f7f7f7;
border-radius:10px;
font-size:14px;
display:none;
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<div class="box">
<h3>Dati cliente</h3>

<input id="nome" placeholder="Nome">
<input id="telefonoUtente" placeholder="Telefono">

<div class="modalita-box">
<button class="modalita-btn active" id="btnRitiro" onclick="selezionaModalita('Ritiro')">Ritiro</button>
<button class="modalita-btn" id="btnConsegna" onclick="selezionaModalita('Consegna a domicilio')">Consegna</button>
</div>

<input id="indirizzo" placeholder="Indirizzo" style="display:none;">
</div>

<div class="box">

<h3>MENU PIZZE</h3>
<div id="listaPizze"></div>

<h4 id="labelEsclusioni" style="display:none;">Esclusioni</h4>
<div id="esclusioniChips"></div>

<label>Formato</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1" min="1">

<h4>Seleziona ingredienti da aggiungere:</h4>
<select id="aggiunteSelect"></select>

<div id="listaAggiunte"></div>

<div id="previewOrdine">
<b>Anteprima:</b>
<div id="previewTesto"></div>
</div>

<button class="main-btn" onclick="aggiungiPizza()">Aggiungi all'ordine</button>

</div>

<div class="box">
<h3>Ordine</h3>
<div id="listaOrdine"></div>
</div>

</div>

<script>

const sheetUrl="https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu={},ordine=[],pizzaSelezionata=null;
let aggiunteSelezionate=[];
let modalitaOrdine="Ritiro";
let tuttePizze=[];

function selezionaModalita(t){
modalitaOrdine=t;
btnRitiro.classList.toggle("active",t==="Ritiro");
btnConsegna.classList.toggle("active",t==="Consegna a domicilio");
indirizzo.style.display=(t==="Consegna a domicilio")?"block":"none";
}

async function caricaMenu(){
const r=await fetch(sheetUrl);
const d=await r.text();

d.split("\n").slice(1).forEach(r=>{
if(!r.trim())return;
let[cat,nome,ing,pn,pf]=r.split(";");

menu[nome]={cat,ing,pn:+pn,pf:+pf};
tuttePizze.push(nome);
});

renderPizze(tuttePizze);
caricaAggiunte();
}

window.onload=caricaMenu;

function renderPizze(list){
listaPizze.innerHTML="";
list.forEach(p=>{
let pf=menu[p].pf>0;

let div=document.createElement("div");
div.className="pizza-item";

div.innerHTML=`
<div class="pizza-nome">${p}</div>
<div class="pizza-ingredienti">${menu[p].ing}</div>
<div class="pizza-prezzo">
${pf?`€${menu[p].pn} / €${menu[p].pf}`:`€${menu[p].pn}`}
</div>`;

div.onclick=()=>selectPizza(p,div);
listaPizze.appendChild(div);
});
}

function selectPizza(p,el){
pizzaSelezionata=p;
document.querySelectorAll(".pizza-item").forEach(x=>x.classList.remove("active"));
el.classList.add("active");

formatoPizza.innerHTML=menu[p].pf
?`<option>Normale</option><option>Familiare</option>`
:`<option>Normale</option>`;

genEsclusioni(p);
updatePreview();
}

function genEsclusioni(p){
esclusioniChips.innerHTML="";
labelEsclusioni.style.display="block";

menu[p].ing.split(",").forEach(i=>{
if(!i.trim())return;
let c=document.createElement("div");
c.className="chip";
c.textContent=i.trim();
c.onclick=()=>{c.classList.toggle("active");updatePreview();}
esclusioniChips.appendChild(c);
});
}

const aggiunte=[
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2}
];

function caricaAggiunte(){
aggiunteSelect.innerHTML="<option value=''>Seleziona</option>";
aggiunte.forEach(a=>{
aggiunteSelect.innerHTML+=`<option value="${a.nome}">${a.nome}</option>`;
});
}

aggiunteSelect.onchange=function(){
let v=this.value;
if(!v)return;
if(!aggiunteSelezionate.includes(v))
aggiunteSelezionate.push(v);
this.value="";
renderAggiunte();
updatePreview();
};

function renderAggiunte(){
listaAggiunte.innerHTML="";
aggiunteSelezionate.forEach((a,i)=>{
listaAggiunte.innerHTML+=`
<div class="aggiunte-box">
${a}
<button class="rimuovi-btn" onclick="removeAgg(${i})">x</button>
</div>`;
});
}

function removeAgg(i){
aggiunteSelezionate.splice(i,1);
renderAggiunte();
updatePreview();
}

function updatePreview(){
if(!pizzaSelezionata){
previewOrdine.style.display="none";
return;
}

let q=+quantita.value;
let f=formatoPizza.value;

let t=`🍕 ${pizzaSelezionata}<br>`;
t+=`📦 ${f}<br>`;
t+=`🔢 ${q}<br>`;

let ex=[...document.querySelectorAll(".chip.active")].map(c=>"❌ "+c.textContent);
if(ex.length)t+=`<br><b>Esclusioni:</b><br>`+ex.join("<br>");

if(aggiunteSelezionate.length){
t+=`<br><b>Aggiunte:</b><br>`+aggiunteSelezionate.map(a=>"+ "+a).join("<br>");
}

previewTesto.innerHTML=t;
previewOrdine.style.display="block";
}

function aggiungiPizza(){

if(!pizzaSelezionata)return;

let q=+quantita.value;
let f=formatoPizza.value;

let base=f==="Familiare"?menu[pizzaSelezionata].pf:menu[pizzaSelezionata].pn;

let extras=[...document.querySelectorAll(".chip.active")].map(c=>"❌ "+c.textContent);

let totExtra=0;

aggiunteSelezionate.forEach(a=>{
let x=aggiunte.find(e=>e.nome===a);
if(x)totExtra+=(f==="Familiare"?x.pf:x.p);
});

let totale=(base*q)+(totExtra*q);

ordine.push({
pizza:pizzaSelezionata,
quantita:q,
formato:f,
totale,
extras,
aggiunte:[...aggiunteSelezionate]
});

aggiorna();

resetAll();
}

function resetAll(){

pizzaSelezionata=null;
aggiunteSelezionate=[];

listaAggiunte.innerHTML="";
esclusioniChips.innerHTML="";
labelEsclusioni.style.display="none";
previewOrdine.style.display="none";

document.querySelectorAll(".pizza-item")
.forEach(x=>x.classList.remove("active"));
}

function aggiorna(){

listaOrdine.innerHTML="";
let tot=0;

ordine.forEach((o,i)=>{
tot+=o.totale;

listaOrdine.innerHTML+=`
<div class="aggiunte-box">
<div>
<b>${o.pizza}</b><br>
${o.formato} x${o.quantita}<br>
€ ${o.totale.toFixed(2)}<br>
${o.extras.join("<br>")}
</div>

<button class="rimuovi-btn" onclick="ordine.splice(${i},1);aggiorna()">x</button>
</div>`;
});
}

</script>

</body>
</html>
