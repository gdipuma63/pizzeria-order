<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.main-btn:hover{
background:#2f2215;
}

#ingredienti{
margin-top:12px;
padding:14px;
background:#fff3e6;
border-left:5px solid #4b3621;
border-radius:8px;
font-size:16px;
line-height:1.4;
}

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

#esclusioniContainer label{
display:block;
margin:6px 0;
}

.aggiunte-box{
margin-top:10px;
padding:10px;
background:#f7f7f7;
border-radius:10px;
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">
<h3>Dati cliente</h3>
<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefonoUtente" placeholder="Telefono">
</div>

<!-- PIZZA -->
<div class="box">

<h3>🍕 Seleziona pizza</h3>

<select id="pizza"></select>

<div id="ingredienti"></div>

<label>Formato pizza</label>
<select id="formatoPizza">
<option value="Normale">Normale</option>
<option value="Familiare">Familiare</option>
</select>

<label>Quantità</label>
<input type="number" id="quantita" value="1" min="1">

<h4>Seleziona aggiunte</h4>

<select id="aggiunteSelect"></select>

<button class="main-btn" type="button" onclick="aggiungiExtra()">➕ Aggiungi aggiunta</button>

<div id="listaAggiunte"></div>

<!-- NOTE SOLO PER VERDURE / SALUMI -->
<div id="noteBox" style="display:none;">
<h5>Dettaglio aggiunta (Verdure / Salumi)</h5>
<textarea id="noteAggiunte"></textarea>
<button class="main-btn" type="button" onclick="salvaNota()">Salva dettaglio</button>
</div>

<h4>Esclusioni</h4>
<div id="esclusioniContainer"></div>

<button class="main-btn" onclick="aggiungiPizza()">Aggiungi all'ordine</button>

</div>

<!-- RIEPILOGO -->
<div class="box">

<h3>🧾 Riepilogo ordine</h3>

<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">Invia ordine su WhatsApp</button>

</div>

</div>

<script>

const sheetUrl="https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu={};
let ordine=[];
let aggiunteSelezionate=[];
let noteAgg={};

const pizzaSelect=document.getElementById("pizza");
const ingredientiDiv=document.getElementById("ingredienti");

/* ================= MENU ================= */

async function caricaMenu(){

const res=await fetch(sheetUrl);
const data=await res.text();

const righe=data.split("\n").slice(1);

righe.forEach(r=>{

if(!r.trim()) return;

const [cat,nome,ing,pn,pf]=r.split(";").map(x=>x.trim());

menu[nome]={ingredienti:ing,pn:+pn,pf:+pf};
});

pizzaSelect.innerHTML='<option value="">Seleziona pizza</option>';

for(let p in menu){

const pfValido=menu[p].pf>0;

pizzaSelect.innerHTML+=`
<option value="${p}">
${p} (${pfValido
? `Normale €${menu[p].pn} / Familiare €${menu[p].pf}`
: `€${menu[p].pn}`})
</option>`;
}
}

/* ================= AGGIUNTE LISTA ================= */

const aggiunte=[
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2},
{nome:"Verdure",p:1,pf:2},
{nome:"Salumi",p:1.5,pf:3},
{nome:"Funghi",p:1.5,pf:3},
{nome:"Bufala",p:2,pf:3.5}
];

function caricaAggiunteSelect(){

const sel=document.getElementById("aggiunteSelect");

sel.innerHTML='<option value="">Seleziona aggiunta</option>';

aggiunte.forEach(a=>{
sel.innerHTML+=`
<option value="${a.nome}">
${a.nome} (€${a.p} / €${a.pf})
</option>`;
});
}

/* ================= AGGIUNGI EXTRA ================= */

function aggiungiExtra(){

const val=document.getElementById("aggiunteSelect").value;
if(!val) return;

aggiunteSelezionate.push(val);

if(val==="Verdure" || val==="Salumi"){
document.getElementById("noteBox").style.display="block";
noteAgg[val]="";
}

renderAggiunte();
}

/* SALVA NOTA */
function salvaNota(){
const val=aggiunteSelezionate[aggiunteSelezionate.length-1];
noteAgg[val]=document.getElementById("noteAggiunte").value;
renderAggiunte();
}

/* RENDER AGGIUNTE */
function renderAggiunte(){

const div=document.getElementById("listaAggiunte");
div.innerHTML="";

aggiunteSelezionate.forEach(a=>{

let nota = noteAgg[a] ? ` (${noteAgg[a]})` : "";

div.innerHTML+=`
<div class="aggiunte-box">
+ ${a}${nota}
</div>
`;
});
}

/* ================= ESCLUSIONI ================= */

pizzaSelect.addEventListener("change",function(){

const p=this.value;
if(!p) return;

ingredientiDiv.innerHTML=`<b>Ingredienti:</b> ${menu[p].ingredienti}`;

const div=document.getElementById("esclusioniContainer");
div.innerHTML="";

menu[p].ingredienti
.split(",")
.map(x=>x.trim())
.filter(x=>x)
.forEach(i=>{

div.innerHTML+=`
<label>
<input type="checkbox" value="${i}">
${i}
</label>
`;
});
});

/* ================= ORDINE ================= */

function aggiungiPizza(){

const p=pizzaSelect.value;
const q=parseInt(document.getElementById("quantita").value);
const formato=document.getElementById("formatoPizza").value;

let base=formato==="Familiare"?menu[p].pf:menu[p].pn;

let listaAgg=[];

aggiunteSelezionate.forEach(a=>{
let nota = noteAgg[a] ? ` (${noteAgg[a]})` : "";
listaAgg.push(a + nota);
});

const totale=base*q;

ordine.push({
pizza:p,
formato,
quantita:q,
totale,
aggiunte:listaAgg
});

aggiorna();

aggiunteSelezionate=[];
noteAgg={};
document.getElementById("noteBox").style.display="none";
});

/* ================= RIEPILOGO ================= */

function aggiorna(){

let div=document.getElementById("listaOrdine");
div.innerHTML="";

let tot=0;

ordine.forEach((o,i)=>{

tot+=o.totale;

div.innerHTML+=`
<div>
<b>${o.pizza} x${o.quantita} - €${o.totale.toFixed(2)}</b><br>
`;

o.aggiunte.forEach(a=>{
div.innerHTML+=`+ ${a}<br>`;
});

div.innerHTML+=`
<button class="rimuovi-btn" onclick="ordine.splice(${i},1);aggiorna();">Rimuovi</button>
<hr>
</div>
`;
});

div.innerHTML+=`<h3>Totale: €${tot.toFixed(2)}</h3>`;
}

/* ================= WHATSAPP ================= */

function inviaOrdine(){

let msg="🍕 ORDINE\n\n";

ordine.forEach(o=>{
msg+=`${o.pizza} x${o.quantita} - €${o.totale}\n`;

o.aggiunte.forEach(a=>{
msg+=`+ ${a}\n`;
});

msg+="\n";
});

window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}

/* INIT */
window.onload=function(){
caricaMenu();
caricaAggiunteSelect();
};

</script>

</body>
</html>
