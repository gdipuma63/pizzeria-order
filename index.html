<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>
body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

label{
display:block;
margin-top:14px;
margin-bottom:8px;
font-weight:600;
color:#4b3621;
}

button{cursor:pointer;}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
padding:12px;
border-radius:8px;
}

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
font-size:12px;
width:auto;
}

.modalita-box{
display:flex;
gap:10px;
margin-top:10px;
}

.modalita-btn{
flex:1;
background:#f1f1f1;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
}

.modalita-btn.active{
background:#4b3621;
color:white;
}

#listaPizze{
max-height:320px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:12px;
margin-top:10px;
}

.pizza-item{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:white;
}

.pizza-item:hover{background:#f8f8f8;}

.pizza-item.active{
background:#e8f0fe;
border-left:4px solid #1a73e8;
}

.pizza-nome{font-weight:bold;color:#4b3621;}

.pizza-prezzo{color:#1a73e8;font-weight:bold;}

.pizza-ingredienti{
font-size:13px;
color:#666;
margin:4px 0;
}

.chip{
padding:6px 10px;
border:1px solid #ccc;
border-radius:20px;
display:inline-block;
margin:4px;
cursor:pointer;
font-size:13px;
}

.chip.active{
background:#4b3621;
color:white;
}

.aggiunte-box{
background:#f7f7f7;
padding:10px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

#previewOrdine{
margin-top:10px;
padding:10px;
background:#f7f7f7;
border-radius:10px;
font-size:14px;
}
</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<div class="box">
<h3>Dati cliente</h3>

<label>Nominativo</label>
<input type="text" id="nome">

<label>Telefono</label>
<input type="text" id="telefonoUtente">

<div class="modalita-box">
<button class="modalita-btn active" id="btnRitiro" onclick="selezionaModalita('Ritiro')">Ritiro</button>
<button class="modalita-btn" id="btnConsegna" onclick="selezionaModalita('Consegna a domicilio')">Consegna</button>
</div>

<input type="text" id="indirizzo" style="display:none;">
</div>

<div class="box">

<h3>CATEGORIA PIZZE</h3>
<select id="filtroCategoria" onchange="filtraPizze()">
<option value="Tutte">Tutte le categorie</option>
</select>

<h3>MENU PIZZE</h3>
<div id="listaPizze"></div>

<h4 id="labelEsclusioni" style="display:none;">Esclusioni</h4>
<div id="esclusioniChips"></div>

<label>Formato</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1">

<h4>Seleziona ingredienti da aggiungere:</h4>
<select id="aggiunteSelect"></select>

<div id="listaAggiunte"></div>

<div id="previewOrdine"><b>Anteprima:</b><div id="previewTesto"></div></div>

<button class="main-btn" onclick="aggiungiPizza()">Aggiungi all'ordine</button>

</div>

<div class="box">
<h3>Riepilogo ordine</h3>
<div id="listaOrdine"></div>
<button class="main-btn" onclick="inviaOrdine()">WhatsApp</button>
</div>

</div>

<script>

const sheetUrl = "https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu = {};
let tuttePizze = [];
let ordine = [];
let pizzaSelezionata = null;
let aggiunteSelezionate = [];
let modalitaOrdine = "Ritiro";

/* ===== MENU ===== */
async function caricaMenu(){
const res = await fetch(sheetUrl);
const data = await res.text();

const righe = data.split("\n").slice(1);
const categorie = new Set();

righe.forEach(r=>{
if(!r.trim()) return;

const [cat,nome,ing,pn,pf] = r.split(";");

menu[nome]={
categoria:cat,
ingredienti:ing,
pn:+pn,
pf:+pf
};

tuttePizze.push(nome);
categorie.add(cat);
});

caricaCategorie([...categorie]);
renderPizze(tuttePizze);
caricaAggiunte();
}

window.onload = caricaMenu;

/* ===== CATEGORIE ===== */
function caricaCategorie(list){
const sel=document.getElementById("filtroCategoria");

list.forEach(c=>{
const opt=document.createElement("option");
opt.value=c;
opt.textContent=c;
sel.appendChild(opt);
});
}

/* ===== FILTRO ===== */
function filtraPizze(){
const cat=document.getElementById("filtroCategoria").value;

const list = (cat==="Tutte")
? tuttePizze
: tuttePizze.filter(p=>menu[p].categoria===cat);

renderPizze(list);
}

/* ===== RENDER ===== */
function renderPizze(list){
const div=document.getElementById("listaPizze");
div.innerHTML="";

list.forEach(p=>{
const m=menu[p];

div.innerHTML+=`
<div class="pizza-item" onclick="selezionaPizza('${p}',this)">
<div class="pizza-nome">${p}</div>
<div class="pizza-ingredienti">${m.ingredienti}</div>
<div class="pizza-prezzo">€${m.pn}${m.pf? " / "+m.pf : ""}</div>
</div>`;
});
}

/* ===== SELEZIONE ===== */
function selezionaPizza(p,el){

pizzaSelezionata=p;

document.querySelectorAll(".pizza-item").forEach(x=>x.classList.remove("active"));
el.classList.add("active");

document.getElementById("formatoPizza").innerHTML =
menu[p].pf ? "<option>Normale</option><option>Familiare</option>" : "<option>Normale</option>";

generaEsclusioni(p);
aggiornaPreview();
}

/* ===== ESCLUSIONI ===== */
function generaEsclusioni(p){
const div=document.getElementById("esclusioniChips");
div.innerHTML="";

menu[p].ingredienti.split(",").forEach(i=>{
if(!i.trim()) return;

const c=document.createElement("div");
c.className="chip";
c.textContent=i.trim();
c.onclick=()=>{c.classList.toggle("active"); aggiornaPreview();};
div.appendChild(c);
});
}

/* ===== AGGIUNTE ===== */
const aggiunte=[
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2},
{nome:"Verdure",p:1,pf:2}
];

function caricaAggiunte(){
const sel=document.getElementById("aggiunteSelect");

aggiunte.forEach(a=>{
sel.innerHTML+=`<option value="${a.nome}">${a.nome} (+€${a.p})</option>`;
});

sel.onchange=()=>aggiungiExtra();
}

function aggiungiExtra(){
const v=document.getElementById("aggiunteSelect").value;
if(!v) return;

if(!aggiunteSelezionate.includes(v)){
aggiunteSelezionate.push(v);
}

document.getElementById("aggiunteSelect").value="";
renderAggiunte();
aggiornaPreview();
}

/* ===== RENDER AGGIUNTE ===== */
function renderAggiunte(){
const div=document.getElementById("listaAggiunte");
div.innerHTML="";

aggiunteSelezionate.forEach((a,i)=>{
div.innerHTML+=`
<div class="aggiunte-box">
${a}
<button class="rimuovi-btn" onclick="rimuoviAgg(${i})">x</button>
</div>`;
});
}

function rimuoviAgg(i){
aggiunteSelezionate.splice(i,1);
renderAggiunte();
aggiornaPreview();
}

/* ===== PREVIEW ===== */
function aggiornaPreview(){
if(!pizzaSelezionata) return;

const f=document.getElementById("formatoPizza").value;
const q=document.getElementById("quantita").value;

let t=`${pizzaSelezionata}<br>${f} x${q}<br>`;

/* esclusioni */
const excl=[...document.querySelectorAll(".chip.active")].map(c=>"❌ "+c.textContent);
excl.forEach(e=>t+=e+"<br>");

/* aggiunte */
aggiunteSelezionate.forEach(a=>t+="➕ "+a+"<br>");

document.getElementById("previewTesto").innerHTML=t;
}

/* ===== AGGIUNGI ORDINE ===== */
function aggiungiPizza(){

if(!pizzaSelezionata) return;

ordine.push({
pizza:pizzaSelezionata,
formato:document.getElementById("formatoPizza").value,
quantita:document.getElementById("quantita").value,
aggiunte:[...aggiunteSelezionate],
esclusioni:[...document.querySelectorAll(".chip.active")].map(c=>c.textContent)
});

ordineUI();

/* RESET COMPLETO */
pizzaSelezionata=null;
aggiunteSelezionate=[];

document.getElementById("listaAggiunte").innerHTML="";
document.getElementById("esclusioniChips").innerHTML="";
document.getElementById("previewTesto").innerHTML="";
document.getElementById("previewOrdine").style.display="none";
}

/* ===== ORDINE UI ===== */
function ordineUI(){
const div=document.getElementById("listaOrdine");
div.innerHTML="";

ordine.forEach((o,i)=>{
div.innerHTML+=`
<div class="aggiunte-box">
<div>
<b>${o.pizza}</b><br>
${o.formato} x${o.quantita}<br>
</div>
<button class="rimuovi-btn" onclick="ordine.splice(${i},1);ordineUI()">x</button>
</div>`;
});
}

/* ===== WHATSAPP ===== */
function inviaOrdine(){

let msg="🍕 ORDINE\n\n";

ordine.forEach(o=>{
msg+=`${o.pizza} ${o.formato} x${o.quantita}\n`;
o.aggiunte.forEach(a=>msg+="➕ "+a+"\n");
msg+="\n";
});

window.open("https://wa.me/?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
