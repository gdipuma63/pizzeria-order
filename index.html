<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

/* HEADER */
.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

/* CONTAINER */
.container{
max-width:800px;
margin:auto;
padding:20px;
}

/* BOX */
.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* INPUT */
input,select,textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

/* LABEL */
label{
display:block;
margin-top:14px;
margin-bottom:8px;
font-weight:600;
color:#4b3621;
}

/* BUTTON */
button{
cursor:pointer;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
padding:12px 20px;
border-radius:8px;
display:block;
width:100%;
max-width:320px;
margin:20px auto;
text-align:center;
box-sizing:border-box;
}

.main-btn:hover{
background:#2f2215;
}

#aggiunteSelect + button{
margin-top:10px;
}

#listaAggiunte + textarea + button{
margin-top:20px;
}
/* DELETE */
.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

/* MOBILE */
@media (max-width:600px){

.modalita-box{
flex-direction:column;
}

}

/* CHIPS */
#esclusioniChips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:4px;
margin-bottom:25px;
}

.chip{
padding:8px 12px;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
font-size:14px;
background:#fff;
user-select:none;
}

.chip:hover{
border-color:#4b3621;
}

.chip.active{
background:#4b3621;
color:white;
border-color:#4b3621;
}
.aggiunte-box{
background:#f7f7f7;
padding:10px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
}
/* LISTA PIZZE */
#listaPizze{
max-height:320px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:12px;
margin-top:10px;
}

.pizza-item{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:white;
}

.pizza-item:hover{background:#f8f8f8;}

.pizza-item.active{
background:#e8f0fe;
border-left:4px solid #1a73e8;
}

.pizza-nome{
font-weight:bold;
color:#4b3621;
}

.pizza-prezzo{
color:#1a73e8;
font-weight:bold;
}

/* MODALITA */
.modalita-box{
display:flex;
gap:10px;
margin-top:10px;
}

.modalita-btn{
flex:1;
background:#f1f1f1;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
}

.modalita-btn.active{
background:#4b3621;
color:white;
}

.pizza-ingredienti{
font-size:13px;
color:#666;
margin:4px 0;
line-height:1.4;
}

#previewOrdine{
margin-top:15px;
padding:12px;
background:#f7f7f7;
border-radius:10px;
font-size:14px;
line-height:1.4;
}
.placeholder-lampeggia{
animation: blinkText 0.8s ease-in-out 4;
color:#c0392b;
font-weight:bold;
}

@keyframes blinkText{

0%{opacity:1;}
50%{opacity:0.2;}
100%{opacity:1;}

}

#toast {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
z-index: 9999;
display: flex;
flex-direction: column;
gap: 10px;
}

.toast-msg {
background: #4b3621;
color: white;
padding: 12px 18px;
border-radius: 10px;
box-shadow: 0 5px 15px rgba(0,0,0,0.2);
font-size: 15px;
min-width: 220px;
text-align: center;
animation: fadeInOut 3s forwards;
}

.toast-error {
background: #c0392b;
}

.toast-success {
background: #27ae60;
}

@keyframes fadeInOut {
0% {opacity:0; transform: translateY(10px);}
10% {opacity:1; transform: translateY(0);}
90% {opacity:1;}
100% {opacity:0; transform: translateY(10px);}
}
    
</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza 🍕</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">

<h3>Dati cliente</h3>

<label>Nominativo *</label>
<input type="text" id="nome" required>

<label>Telefono *</label>
<input type="text" id="telefonoUtente" required>

<h4 style="text-align:center;">Seleziona la modalità di consegna</h4>

<div class="modalita-box">

<button class="modalita-btn active" id="btnRitiro"
onclick="selezionaModalita('Ritiro')">🏠 In pizzeria</button>

<button class="modalita-btn" id="btnConsegna"
onclick="selezionaModalita('Consegna a domicilio')">🛵 Consegna a domicilio</button>

</div>

<div id="indirizzoBox" style="display:none; gap:8px; flex-direction:column;">

<input type="text" id="indirizzo"
placeholder="Indirizzo (solo consegna a domicilio)"
style="width:100%;">

<button type="button" class="main-btn" onclick="rilevaPosizione()">
🌍 Usa la mia posizione
</button>

</div>

</div>

<!-- PIZZE -->
<div class="box">

<h3 style="text-align:center;">CATEGORIA PIZZE</h3>

<select id="filtroCategoria" onchange="filtraPizze()">
<option value="Tutte">Tutte le categorie</option>
</select>

<h3 style="text-align:center;">🍕 MENU PIZZE 🍕</h3>

<div id="listaPizze"></div>

<h4 id="labelEsclusioni" style="display:none;">
Seleziona ingredienti da eliminare:
</h4>

<div id="esclusioniChips"></div>

<label>Formato</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1" min="1">

<h4>Seleziona ingredienti da aggiungere:</h4>

<select id="aggiunteSelect" onchange="aggiungiExtra()"></select>

<div id="listaAggiunte"></div>

<div id="previewOrdine" class="aggiunte-box" style="display:none;">
<b>Anteprima ordine:</b>
<div id="previewTesto"></div>
</div>

<button class="main-btn" onclick="aggiungiPizza()">
Aggiungi all'ordine
</button>

</div>

<!-- ORDINE -->
<div class="box">

<h3>🧾 Riepilogo Ordine</h3>
<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">
Invia WhatsApp
</button>

</div>

</div>

<script>

const sheetUrl = "https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu = {};
let ordine = [];
let pizzaSelezionata = null;
let aggiunteSelezionate = [];
let modalitaOrdine = "Ritiro";
let tuttePizze = [];

let statoAggiunte = "base";

const listaPizze = document.getElementById("listaPizze");

/* MODALITA */
function selezionaModalita(tipo){

modalitaOrdine = tipo;

document.getElementById("btnRitiro").classList.remove("active");
document.getElementById("btnConsegna").classList.remove("active");

document.getElementById("indirizzoBox").style.display =
(tipo === "Consegna a domicilio") ? "flex" : "none";

/* 👇 AGGIUNTA QUI */
if (tipo === "Ritiro") {
    document.getElementById("indirizzo").value = "";
}
  
document.getElementById("btnRitiro").classList.toggle("active", tipo==="Ritiro");
document.getElementById("btnConsegna").classList.toggle("active", tipo==="Consegna a domicilio");
}

/* MENU */
async function caricaMenu(){

const res = await fetch(sheetUrl);
const data = await res.text();

const righe = data.split("\n").slice(1);

const categorieSet = new Set();

righe.forEach(r=>{
if(!r.trim()) return;

const [cat,nomeRaw,ing,pn,pf] = r.split(";");
const nome = nomeRaw.trim();

menu[nome]={
categoria:cat,
ingredienti:ing,
pn:parseFloat(pn),
pf: pf && !isNaN(parseFloat(pf)) ? parseFloat(pf) : 0
};

if (!tuttePizze.includes(nome.trim())) {
    tuttePizze.push(nome.trim());
}

categorieSet.add(cat);
});

caricaCategorie([...categorieSet].sort());
renderPizze(tuttePizze);
caricaAggiunteSelect();
}

window.onload = caricaMenu;

/* CATEGORIE */
function caricaCategorie(cats){
const sel=document.getElementById("filtroCategoria");
cats.forEach(c=>{
let opt=document.createElement("option");
opt.value=c;
opt.textContent=c;
sel.appendChild(opt);
});
}

/* FILTRO */
function filtraPizze(){
const cat=document.getElementById("filtroCategoria").value;

const list = (cat==="Tutte")
?tuttePizze
:tuttePizze.filter(p=>menu[p].categoria===cat);

renderPizze(list);

document.getElementById("listaPizze")
.scrollIntoView({behavior:"smooth",block:"start"});
}

/* RENDER */
function renderPizze(lista){

listaPizze.innerHTML = "";

lista.forEach(p => {

const pfValido = menu[p].pf > 0;

const div = document.createElement("div");
div.className = "pizza-item";

div.innerHTML = `
<div class="pizza-nome">${p}</div>

<div class="pizza-ingredienti">
${menu[p].ingredienti}
</div>

<div class="pizza-prezzo">
${pfValido
? `Normale €${menu[p].pn} • Familiare €${menu[p].pf}`
: `€${menu[p].pn}`}
</div>
`;

div.onclick = () => selezionaPizza(p, div);

listaPizze.appendChild(div);

});

}
/* SELEZIONE PIZZA */
function selezionaPizza(p,el){

pizzaSelezionata=p;

statoAggiunte = "base"; // 🔴 FIX FONDAMENTALE

document.querySelectorAll(".pizza-item").forEach(x=>x.classList.remove("active"));
el.classList.add("active");

generaEsclusioni(p);

document.getElementById("labelEsclusioni").style.display="block";
aggiornaPreview();

const f=document.getElementById("formatoPizza");
f.innerHTML = menu[p].pf
? `<option>Normale</option><option>Familiare</option>`
: `<option>Normale</option>`;

caricaAggiunteSelect();
}

/* ESCLUSIONI */
function generaEsclusioni(p){

const div=document.getElementById("esclusioniChips");
div.innerHTML="";

menu[p].ingredienti.split(",").forEach(i=>{
if(!i.trim()) return;

const chip=document.createElement("div");
chip.className="chip";
chip.textContent=i.trim();
chip.onclick = () => {
chip.classList.toggle("active");
aggiornaPreview();
};
div.appendChild(chip);
});
}

/* AGGIUNTE */
  
const aggiunte = [
/* EXTRA BASE */
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2},
{nome:"Bufala",p:2,pf:3.5},
];

const verdure = [
/* VERDURE */
{nome:"Zucchine",p:1,pf:2},
{nome:"Melanzane",p:1,pf:2},
{nome:"Peperoni",p:1,pf:2},
{nome:"Funghi",p:2,pf:3.5},
{nome:"Funghi porcini",p:2,pf:3.5},
];

const salumi = [
/* SALUMI */
{nome:"Prosciutto",p:1.5,pf:3},
{nome:"Prosciutto crudo",p:1.5,pf:3},
{nome:"Speck",p:1.5,pf:3},
{nome:"Salame",p:1.5,pf:3},
{nome:"Salame piccante",p:1.5,pf:3},
{nome:"Bresaola",p:2,pf:3.5}

];

function caricaAggiunteSelect(){

const sel = document.getElementById("aggiunteSelect");
sel.innerHTML = "";

/* --- BASE --- */
if(statoAggiunte === "base"){

sel.innerHTML = `<option value=''>Seleziona aggiunta</option>`;

/* extra normali */
aggiunte.forEach(a => {
sel.innerHTML += `
<option value="EXTRA_${a.nome}">
${a.nome} (+€${a.p})
</option>`;
});

sel.innerHTML += `<option disabled>────────────</option>`;

/* NAV ma con aspetto "normale" */
sel.innerHTML += `
<option value="NAV_VERDURE">
Verdure (+€1)
</option>`;

sel.innerHTML += `
<option value="NAV_SALUMI">
Salumi (+€1.5)
</option>`;

return;
}

/* --- VERDURE --- */
if(statoAggiunte === "verdure"){

sel.innerHTML = `<option value=''>Seleziona verdura</option>`;

verdure.forEach(v=>{
sel.innerHTML += `
<option value="ADD_${v.nome}">
${v.nome} (+€${v.p})
</option>`;
});

sel.innerHTML += `<option value="BACK">← Torna alle aggiunte</option>`;

return;
}

/* --- SALUMI --- */
if(statoAggiunte === "salumi"){

sel.innerHTML = `<option value=''>Seleziona salume</option>`;

salumi.forEach(s=>{
sel.innerHTML += `
<option value="ADD_${s.nome}">
${s.nome} (+€${s.p})
</option>`;
});

sel.innerHTML += `<option value="BACK">← Torna alle aggiunte</option>`;
}
}

function aggiungiExtra(){

const sel = document.getElementById("aggiunteSelect");
const val = sel.value;
  
/* 🔍 DEBUG STEP 3 */
console.log("STATO AGGIUNTE:", statoAggiunte);
console.log("VALORE SELEZIONATO:", val);
  
if(!val) return;

/* --- NAVIGAZIONE CATEGORIE --- */
if(val === "NAV_VERDURE"){
statoAggiunte = "verdure";
caricaAggiunteSelect();
sel.value = "";

lampeggiaPlaceholder();

return;
}

if(val === "NAV_SALUMI"){
statoAggiunte = "salumi";
caricaAggiunteSelect();
sel.value = "";

lampeggiaPlaceholder();

return;
}

if(val === "BACK"){
statoAggiunte = "base";
caricaAggiunteSelect();
sel.value = "";
return;
}

/* --- AGGIUNTE BASE (EXTRA_) --- */
if(val.startsWith("EXTRA_")){
const item = val.replace("EXTRA_","");

if(!aggiunteSelezionate.includes(item)){
aggiunteSelezionate.push(item);
}

sel.value = "";
renderAggiunte();
aggiornaPreview();
return;
}

/* --- VERDURE / SALUMI (ADD_) --- */
if(val.startsWith("ADD_")){
const item = val.replace("ADD_","");

if(!aggiunteSelezionate.includes(item)){
aggiunteSelezionate.push(item);
}

sel.value = "";
renderAggiunte();
aggiornaPreview();
return;
}
}

function renderAggiunte(){
const div=document.getElementById("listaAggiunte");
div.innerHTML="";

aggiunteSelezionate.forEach((a,i)=>{
div.innerHTML+=`
<div class="aggiunte-box">
${a}
<button class="rimuovi-btn" onclick="rimuoviAgg(${i})">❌</button>
</div>`;
});
}

function lampeggiaPlaceholder(){

const sel = document.getElementById("aggiunteSelect");

sel.classList.remove("placeholder-lampeggia");

/* reset animazione */
void sel.offsetWidth;

sel.classList.add("placeholder-lampeggia");

/* evita duplicazioni di listener */
sel.removeEventListener("mousedown", stopBlink);
sel.removeEventListener("touchstart", stopBlink);

sel.addEventListener("mousedown", stopBlink);
sel.addEventListener("touchstart", stopBlink);

}

function stopBlink(){
const sel = document.getElementById("aggiunteSelect");
sel.classList.remove("placeholder-lampeggia");

sel.removeEventListener("mousedown", stopBlink);
sel.removeEventListener("touchstart", stopBlink);
}

function aggiornaPreview(){

if(!pizzaSelezionata){
document.getElementById("previewOrdine").style.display="none";
return;
}

const formato=document.getElementById("formatoPizza").value;
const q=document.getElementById("quantita").value;

let testo="";

testo+=`🍕 ${pizzaSelezionata}<br>`;
testo+=`📦 ${formato}<br>`;
testo+=`🔢 Quantità: ${q}<br>`;

// esclusioni
const excl=[];
document.querySelectorAll("#esclusioniChips .chip.active")
.forEach(c=>excl.push("- "+c.textContent));

if(excl.length){
testo+=`<br><b>❌ Esclusioni:</b><br>`;
excl.forEach(e=>testo+=e+"<br>");
}

// aggiunte
if(aggiunteSelezionate.length){
testo+=`<br><b>➕ Aggiunte:</b><br>`;
aggiunteSelezionate.forEach(a=>testo+="+ "+a+"<br>");
}

document.getElementById("previewOrdine").style.display="block";
document.getElementById("previewTesto").innerHTML=testo;
}

function rimuoviAgg(i){
aggiunteSelezionate.splice(i,1);
renderAggiunte();
aggiornaPreview();
}

/* AGGIUNGI ORDINE */
function aggiungiPizza(){

if(!pizzaSelezionata){
showToast("Seleziona una pizza", "error");
return;
}

const nome=document.getElementById("nome").value.trim();
const tel=document.getElementById("telefonoUtente").value.trim();

if(!nome || !tel){
showToast("Compila nome e telefono", "error");
return;
}

if(modalitaOrdine==="Consegna a domicilio"){

const indirizzo=document.getElementById("indirizzo").value.trim();

if(!indirizzo){
showToast("Inserisci indirizzo", "error");
return;
}

}

const q=parseInt(document.getElementById("quantita").value);

const formato=document.getElementById("formatoPizza").value;

const base=(formato==="Familiare")
? menu[pizzaSelezionata].pf
: menu[pizzaSelezionata].pn;

let extras=[];

document.querySelectorAll("#esclusioniChips .chip.active")
.forEach(c=>{
extras.push("- "+c.textContent);
});

aggiunteSelezionate.forEach(a=>{
extras.push("+ "+a);
});

const tutteLeAggiunte = [
  ...aggiunte,
  ...verdure,
  ...salumi
];

let extraTotale = 0;

aggiunteSelezionate.forEach(a => {

  const add = tutteLeAggiunte.find(x => x.nome === a);

  if (!add) return;

  extraTotale += (formato === "Familiare")
    ? add.pf
    : add.p;

});

const totale = (base * q) + (extraTotale * q);
    
ordine.push({
pizza: pizzaSelezionata,
quantita: q,
formato: formato,
totale: totale,
aggiunte: [...aggiunteSelezionate],
extras: [...extras]
});

showToast(`${pizzaSelezionata} aggiunta all'ordine!`, "success");
    
aggiorna();

/* RESET COMPLETO FORM PIZZA */

aggiunteSelezionate = [];

// reset quantità
document.getElementById("quantita").value = 1;

// reset select aggiunte
document.getElementById("aggiunteSelect").selectedIndex = 0;

// reset lista aggiunte
document.getElementById("listaAggiunte").innerHTML = "";

// reset esclusioni
document.getElementById("esclusioniChips").innerHTML = "";
document.getElementById("labelEsclusioni").style.display = "none";

// reset anteprima
document.getElementById("previewTesto").innerHTML = "";
document.getElementById("previewOrdine").style.display = "none";

// deseleziona pizza
document.querySelectorAll(".pizza-item")
.forEach(x => x.classList.remove("active"));

pizzaSelezionata = null;

// reset formato
document.getElementById("formatoPizza").selectedIndex = 0;

}

function aggiorna(){

const div=document.getElementById("listaOrdine");

div.innerHTML="";

let totale=0;

ordine.forEach((o,i)=>{

totale+=o.totale;

div.innerHTML+=`
<div class="aggiunte-box">

<div>
<b>${o.pizza}</b><br>
${o.formato} x${o.quantita}<br>
€ ${o.totale.toFixed(2)}<br>

${o.extras ? o.extras.map(e=>e+"<br>").join("") : ""}

</div>

<button class="rimuovi-btn"
onclick="rimuoviOrdine(${i})">
❌
</button>

</div>
`;

});

div.innerHTML+=`<h3>Totale € ${totale.toFixed(2)}</h3>`;

}

function rimuoviOrdine(i){

ordine.splice(i,1);

aggiorna();

}
/* WHATSAPP */
function inviaOrdine(){

if(ordine.length===0){
showToast("Ordine vuoto", "error");
return;
}

const nome=document.getElementById("nome").value.trim();
const tel=document.getElementById("telefonoUtente").value.trim();

let msg="🍕 ORDINE PIZZERIA\n\n";

msg+="👤 "+nome+"\n";
msg+="📞 "+tel+"\n";
msg+="🚚 "+modalitaOrdine+"\n";

if(modalitaOrdine==="Consegna a domicilio"){

msg+="📍 "+document.getElementById("indirizzo").value+"\n";

}

msg+="\n";

let totale=0;

ordine.forEach(o=>{

totale+=o.totale;

msg+=`${o.pizza} (${o.formato}) x${o.quantita}\n`;

o.aggiunte.forEach(a=>{
msg += "+ " + a + "\n";
});

msg+=`€ ${o.totale.toFixed(2)}\n\n`;

});

msg+="💰 Totale: € "+totale.toFixed(2);

window.open(
"https://wa.me/?text="+encodeURIComponent(msg)
);

}

function rilevaPosizione(){

const indirizzoInput = document.getElementById("indirizzo");

if(!navigator.geolocation){
showToast("Geolocalizzazione non supportata", "error");
return;
}

navigator.geolocation.getCurrentPosition(async (pos) => {

const lat = pos.coords.latitude;
const lon = pos.coords.longitude;

const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`;

try{

const res = await fetch(url);
const data = await res.json();

if(data && data.address){

const a = data.address;

const strada = a.road || "";
const civico = a.house_number || "";
const citta = a.city || a.town || a.village || "";
const cap = a.postcode || "";

indirizzoInput.value =
`${strada} ${civico}, ${cap} ${citta}`.trim();

}else{

indirizzoInput.value = lat + ", " + lon;

}

}catch(e){

indirizzoInput.value = lat + ", " + lon;

}

}, () => {

showToast("Impossibile rilevare la posizione", "error");

});

}


function showToast(message, type = "info") {

const toast = document.getElementById("toast");

const div = document.createElement("div");
div.className = "toast-msg";

if (type === "error") div.classList.add("toast-error");
if (type === "success") div.classList.add("toast-success");

div.textContent = message;

toast.appendChild(div);

// rimuove dopo animazione
setTimeout(() => {
div.remove();
}, 3000);

}
</script>
    
<div id="toast"></div>

</body>
</html>
