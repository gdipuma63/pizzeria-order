<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.main-btn:hover{
background:#2f2215;
}

.quick-buttons button{
width:auto;
padding:8px 12px;
margin:5px;
background:#9370db;
color:white;
border:none;
border-radius:20px;
cursor:pointer;
}

.quick-buttons button.selected{
background:#4b3621;
}

#ingredienti{
margin-top:10px;
padding:10px;
background:#f2f2f2;
border-radius:8px;
}

hr{
margin:15px 0;
}

</style>
</head>

<body>

<div class="header">
🍕 Ordina la tua pizza
</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">

<h3>Dati cliente</h3>

<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefonoUtente" placeholder="Telefono">

<select id="modalita">
<option value="">Modalità ordine</option>
<option>Consegna a domicilio</option>
<option>Ritiro in pizzeria</option>
</select>

<div id="indirizzoBox" style="display:none;">
<input type="text" id="indirizzo" placeholder="Indirizzo">
</div>

</div>

<!-- PIZZA -->
<div class="box">

<h3>🍕 Seleziona pizza</h3>

<select id="pizza">
<option>Caricamento menu...</option>
</select>

<div id="ingredienti"></div>

<label>Formato pizza</label>
<select id="formatoPizza">
<option value="Normale">Normale</option>
<option value="Familiare">Familiare</option>
</select>

<label>Quantità</label>
<input type="number" id="quantita" value="1" min="1">

<!-- AGGIUNTE -->
<h4>Aggiunte</h4>
<div id="aggiunteContainer"></div>

<h5>Note aggiuntive</h5>
<textarea id="noteAggiunte" placeholder="Scrivi richieste extra (es. senza lattosio, ben cotta...)"></textarea>

<!-- ESCLUSIONI SEMPLICI -->
<h4>Esclusioni</h4>
<div id="modifiche" class="quick-buttons">
<button type="button" data-val="Senza mozzarella">Senza mozzarella</button>
<button type="button" data-val="Senza cipolla">Senza cipolla</button>
<button type="button" data-val="Senza pomodoro">Senza pomodoro</button>
</div>

<button class="main-btn" onclick="aggiungiPizza()">
Aggiungi all'ordine
</button>

</div>

<!-- RIEPILOGO -->
<div class="box">

<h3>🧾 Riepilogo ordine</h3>

<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">
Invia ordine su WhatsApp
</button>

</div>

</div>

<script>

const sheetUrl = "https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

const pizzaSelect = document.getElementById("pizza");
const ingredientiDiv = document.getElementById("ingredienti");
const formatoPizza = document.getElementById("formatoPizza");
const optionFamiliare = formatoPizza.querySelector('option[value="Familiare"]');

let menu = {};
let ordine = [];
let aggiunteSelezionate = [];
let modificheSelezionate = [];

/* ================= MENU ================= */
async function caricaMenu(){

const response = await fetch(sheetUrl);
const data = await response.text();

const righe = data.split("\n").slice(1);

righe.forEach(riga=>{
if(!riga.trim()) return;

const [categoria,nome,ingredienti,prezzoNormale,prezzoFamiglia] =
riga.split(";").map(x => x.replace("\r","").trim());

if(!nome) return;

menu[nome] = {
categoria,
ingredienti,
prezzoNormale: parseFloat(prezzoNormale) || 0,
prezzoFamiglia: parseFloat(prezzoFamiglia) || 0
};

});

/* POPOLA MENU */
pizzaSelect.innerHTML = '<option value="">Seleziona pizza</option>';

for(let pizza in menu){

const pn = menu[pizza].prezzoNormale;
const pf = menu[pizza].prezzoFamiglia;

const pfValido = !isNaN(pf) && pf > 0;

let prezzoTesto;

if(pfValido){
prezzoTesto = `Normale €${pn.toFixed(2)} / Familiare €${pf.toFixed(2)}`;
}else{
prezzoTesto = `€${pn.toFixed(2)}`;
}

const option = document.createElement("option");
option.value = pizza;
option.text = `${pizza} (${prezzoTesto})`;

pizzaSelect.add(option);
}

renderAggiunte();
}

window.addEventListener("load", caricaMenu);

/* ================= AGGIUNTE STRUTTURATE ================= */

const aggiunteConfig = [
{
gruppo: "Base (€1 / €2)",
prezzoNormale: 1.00,
prezzoFamiliare: 2.00,
items: ["Patatine","Wurstel","Grana","Ciliegino","Verdure","Crema Formaggi"]
},
{
gruppo: "Speciali (€1.50 / €3)",
prezzoNormale: 1.50,
prezzoFamiliare: 3.00,
items: ["Salumi","Salsiccia","Funghi"]
},
{
gruppo: "Premium (€2 / €3.50)",
prezzoNormale: 2.00,
prezzoFamiliare: 3.50,
items: ["Mozzarella di Bufala","Porcini","Crema Tartufata"]
}
];

/* render aggiunte */
function renderAggiunte(){

const container = document.getElementById("aggiunteContainer");

aggiunteConfig.forEach(gruppo=>{

const box = document.createElement("div");

box.innerHTML = `<b>${gruppo.gruppo}</b><br>`;

gruppo.items.forEach(item=>{

const btn = document.createElement("button");
btn.textContent = item;
btn.type = "button";
btn.style.margin = "5px";
btn.style.padding = "6px 10px";
btn.style.borderRadius = "20px";
btn.style.border = "none";
btn.style.background = "#9370db";
btn.style.color = "white";
btn.style.cursor = "pointer";

btn.onclick = () => {

const exists = aggiunteSelezionate.find(x=>x.nome===item);

if(exists){
aggiunteSelezionate = aggiunteSelezionate.filter(x=>x.nome!==item);
btn.classList.remove("selected");
}else{
aggiunteSelezionate.push({
nome:item,
prezzoNormale:gruppo.prezzoNormale,
prezzoFamiliare:gruppo.prezzoFamiliare
});
btn.classList.add("selected");
}

};

box.appendChild(btn);
});

container.appendChild(box);
});
}

/* ================= UI PIZZA ================= */

pizzaSelect.addEventListener("change", aggiornaUI);
formatoPizza.addEventListener("change", aggiornaPrezzo);

function aggiornaUI(){

const pizza = pizzaSelect.value;
if(!pizza) return;

const pf = menu[pizza].prezzoFamiglia;
const pfValido = !isNaN(pf) && pf > 0;

if(pfValido){
optionFamiliare.style.display = "block";
formatoPizza.disabled = false;
formatoPizza.value = "Normale";
}else{
optionFamiliare.style.display = "none";
formatoPizza.value = "Normale";
formatoPizza.disabled = true;
}

aggiornaPrezzo();
}

/* prezzo selezionato */
function aggiornaPrezzo(){

const pizza = pizzaSelect.value;
if(!pizza) return;

const formato = formatoPizza.value;

const prezzo =
formato === "Familiare"
? menu[pizza].prezzoFamiglia
: menu[pizza].prezzoNormale;

ingredientiDiv.innerHTML =
`<b>Ingredienti:</b> ${menu[pizza].ingredienti}<br>
<b>Prezzo:</b> €${prezzo.toFixed(2)}`;
}

/* ================= AGGIUNGI PIZZA ================= */

function aggiungiPizza(){

const pizza = pizzaSelect.value;
const quantita = parseInt(document.getElementById("quantita").value);

if(!pizza){
alert("Seleziona una pizza");
return;
}

const formato = formatoPizza.value;

const prezzo =
formato === "Familiare"
? menu[pizza].prezzoFamiglia
: menu[pizza].prezzoNormale;

ordine.push({
pizza,
formato,
quantita,
prezzo,
aggiunte:[...aggiunteSelezionate],
noteAggiunte:document.getElementById("noteAggiunte").value || ""
});

aggiornaLista();

aggiunteSelezionate=[];
document.getElementById("noteAggiunte").value="";
}

/* ================= LISTA ================= */

function aggiornaLista(){

const div=document.getElementById("listaOrdine");
div.innerHTML="";

let totale=0;

ordine.forEach((item,index)=>{

const subtotale=item.prezzo*item.quantita;
totale+=subtotale;

div.innerHTML+=`
<div>
<b>${item.pizza} (${item.formato}) x${item.quantita} - €${subtotale.toFixed(2)}</b><br>
`;

if(item.aggiunte.length){
item.aggiunte.forEach(a=>{
div.innerHTML+=`Aggiunta: ${a.nome}<br>`;
});
}

if(item.noteAggiunte){
div.innerHTML+=`Note: ${item.noteAggiunte}<br>`;
}

div.innerHTML+=`<hr></div>`;
});

div.innerHTML+=`<h3>Totale: €${totale.toFixed(2)}</h3>`;
}

/* ================= WHATSAPP ================= */

function inviaOrdine(){

let messaggio="🍕 ORDINE PIZZERIA\n\n";

ordine.forEach((item,i)=>{

messaggio+=`${i+1}) ${item.pizza} (${item.formato}) x${item.quantita}\n`;

item.aggiunte.forEach(a=>{
messaggio+=`+ ${a.nome}\n`;
});

if(item.noteAggiunte){
messaggio+=`Note: ${item.noteAggiunte}\n`;
}

messaggio+="\n";
});

const url=`https://wa.me/?text=${encodeURIComponent(messaggio)}`;

window.open(url,"_blank");
}

</script>

</body>
</html>
