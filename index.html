<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

/* HEADER */
.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

/* CONTAINER */
.container{
max-width:800px;
margin:auto;
padding:20px;
}

/* BOX */
.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

/* INPUT */
input,select,textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

/* LABEL */
label{
display:block;
margin-top:14px;
margin-bottom:8px;
font-weight:600;
color:#4b3621;
}

/* BUTTON */
button{
cursor:pointer;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
padding:12px;
border-radius:8px;
}

.main-btn:hover{
background:#2f2215;
}

/* DELETE */
.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

/* MOBILE */
@media (max-width:600px){
.rimuovi-btn{width:100%;}
.modalita-box{flex-direction:column;}
}

/* CHIPS */
#esclusioniChips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:4px;
margin-bottom:25px;
}

.chip{
padding:8px 12px;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
font-size:14px;
background:#fff;
user-select:none;
}

.chip:hover{
border-color:#4b3621;
}

.chip.active{
background:#4b3621;
color:white;
border-color:#4b3621;
}

/* LISTA PIZZE */
#listaPizze{
max-height:320px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:12px;
margin-top:10px;
}

.pizza-item{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:white;
}

.pizza-item:hover{background:#f8f8f8;}

.pizza-item.active{
background:#e8f0fe;
border-left:4px solid #1a73e8;
}

.pizza-nome{
font-weight:bold;
color:#4b3621;
}

.pizza-prezzo{
color:#1a73e8;
font-weight:bold;
}

/* MODALITA */
.modalita-box{
display:flex;
gap:10px;
margin-top:10px;
}

.modalita-btn{
flex:1;
background:#f1f1f1;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
}

.modalita-btn.active{
background:#4b3621;
color:white;
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">

<h3>Dati cliente</h3>

<label>Nominativo *</label>
<input type="text" id="nome" required>

<label>Telefono *</label>
<input type="text" id="telefonoUtente" required>

<h4 style="text-align:center;">Modalità di consegna</h4>

<div class="modalita-box">

<button class="modalita-btn active" id="btnRitiro"
onclick="selezionaModalita('Ritiro')">🏠 Ritiro</button>

<button class="modalita-btn" id="btnConsegna"
onclick="selezionaModalita('Consegna a domicilio')">🛵 Consegna</button>

</div>

<input type="text" id="indirizzo"
placeholder="Indirizzo (solo consegna a domicilio)"
style="display:none;">

</div>

<!-- PIZZE -->
<div class="box">

<h3 style="text-align:center;">🍕 CATEGORIA PIZZE 🍕</h3>

<select id="filtroCategoria" onchange="filtraPizze()">
<option value="Tutte">Tutte le categorie</option>
</select>

<h3 style="text-align:center;">🍕 MENU PIZZE 🍕</h3>

<div id="listaPizze"></div>

<h4 id="labelEsclusioni" style="display:none;">
Seleziona ingredienti da eliminare:
</h4>

<div id="esclusioniChips"></div>

<label>Formato</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1" min="1">

<h4>Aggiunte</h4>
<select id="aggiunteSelect"></select>
<button class="main-btn" onclick="aggiungiExtra()">➕ Aggiungi</button>

<div id="listaAggiunte"></div>

<textarea id="noteAggiunte" style="display:none"></textarea>

<button class="main-btn" onclick="aggiungiPizza()">
Aggiungi all'ordine
</button>

</div>

<!-- ORDINE -->
<div class="box">

<h3>🧾 Riepilogo</h3>
<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">
Invia WhatsApp
</button>

</div>

</div>

<script>

const sheetUrl = "https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu = {};
let ordine = [];
let pizzaSelezionata = null;
let aggiunteSelezionate = [];
let modalitaOrdine = "Ritiro";

let tuttePizze = [];

const listaPizze = document.getElementById("listaPizze");

/* MODALITA */
function selezionaModalita(tipo){

modalitaOrdine = tipo;

document.getElementById("btnRitiro").classList.remove("active");
document.getElementById("btnConsegna").classList.remove("active");

document.getElementById("indirizzo").style.display =
(tipo === "Consegna a domicilio") ? "block" : "none";

document.getElementById("btnRitiro").classList.toggle("active", tipo==="Ritiro");
document.getElementById("btnConsegna").classList.toggle("active", tipo==="Consegna a domicilio");
}

/* MENU */
async function caricaMenu(){

const res = await fetch(sheetUrl);
const data = await res.text();

const righe = data.split("\n").slice(1);

const categorieSet = new Set();

righe.forEach(r=>{
if(!r.trim()) return;

const [cat,nome,ing,pn,pf] = r.split(";");

menu[nome]={
categoria:cat,
ingredienti:ing,
pn:parseFloat(pn),
pf:parseFloat(pf)
};

tuttePizze.push(nome);
categorieSet.add(cat);
});

caricaCategorie([...categorieSet]);
renderPizze(tuttePizze);
caricaAggiunteSelect();
}

window.onload = caricaMenu;

/* CATEGORIE */
function caricaCategorie(cats){
const sel=document.getElementById("filtroCategoria");
cats.forEach(c=>{
let opt=document.createElement("option");
opt.value=c;
opt.textContent=c;
sel.appendChild(opt);
});
}

/* FILTRO */
function filtraPizze(){
const cat=document.getElementById("filtroCategoria").value;

const list = (cat==="Tutte")
?tuttePizze
:tuttePizze.filter(p=>menu[p].categoria===cat);

renderPizze(list);

document.getElementById("listaPizze")
.scrollIntoView({behavior:"smooth",block:"start"});
}

/* RENDER */
function renderPizze(lista){

listaPizze.innerHTML = "";

lista.forEach(p => {

const pfValido = menu[p].pf > 0;

const div = document.createElement("div");
div.className = "pizza-item";

div.innerHTML = `
<div class="pizza-nome">${p}</div>

<div class="pizza-ingredienti">
${menu[p].ingredienti}
</div>

<div class="pizza-prezzo">
${pfValido
? `Normale €${menu[p].pn} • Familiare €${menu[p].pf}`
: `€${menu[p].pn}`}
</div>
`;

div.onclick = () => selezionaPizza(p, div);

listaPizze.appendChild(div);

});

}
/* SELEZIONE PIZZA */
function selezionaPizza(p,el){

pizzaSelezionata=p;

document.querySelectorAll(".pizza-item").forEach(x=>x.classList.remove("active"));
el.classList.add("active");

generaEsclusioni(p);

document.getElementById("labelEsclusioni").style.display="block";

const f=document.getElementById("formatoPizza");
f.innerHTML=menu[p].pf?`<option>Normale</option><option>Familiare</option>`:`<option>Normale</option>`;
}

/* ESCLUSIONI */
function generaEsclusioni(p){

const div=document.getElementById("esclusioniChips");
div.innerHTML="";

menu[p].ingredienti.split(",").forEach(i=>{
if(!i.trim()) return;

const chip=document.createElement("div");
chip.className="chip";
chip.textContent=i.trim();
chip.onclick=()=>chip.classList.toggle("active");
div.appendChild(chip);
});
}

/* AGGIUNTE */
const aggiunte=[
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2},
{nome:"Verdure",p:1,pf:2}
];

function caricaAggiunteSelect(){
const sel=document.getElementById("aggiunteSelect");
sel.innerHTML="<option value=''>Seleziona</option>";

aggiunte.forEach(a=>{
sel.innerHTML+=`<option>${a.nome}</option>`;
});
}

function aggiungiExtra(){
const v=document.getElementById("aggiunteSelect").value;
if(!v) return;
aggiunteSelezionate.push(v);
renderAggiunte();
}

function renderAggiunte(){
const div=document.getElementById("listaAggiunte");
div.innerHTML="";

aggiunteSelezionate.forEach((a,i)=>{
div.innerHTML+=`
<div class="aggiunte-box">
${a}
<button class="rimuovi-btn" onclick="rimuoviAgg(${i})">❌</button>
</div>`;
});
}

function rimuoviAgg(i){
aggiunteSelezionate.splice(i,1);
renderAggiunte();
}

/* AGGIUNGI ORDINE */
function aggiungiPizza(){

if(!pizzaSelezionata) return;

const nome=document.getElementById("nome").value.trim();
const tel=document.getElementById("telefonoUtente").value.trim();

if(!nome||!tel){
alert("Compila nome e telefono");
return;
}

ordine.push({
pizza:pizzaSelezionata,
quantita:1
});

aggiorna();
}

function aggiorna(){

const div=document.getElementById("listaOrdine");
div.innerHTML="";

ordine.forEach(o=>{
div.innerHTML+=`<div>${o.pizza}</div>`;
});
}

/* WHATSAPP */
function inviaOrdine(){

let msg="🍕 ORDINE\n\n";

ordine.forEach(o=>{
msg+=o.pizza+"\n";
});

window.open("https://wa.me/?text="+encodeURIComponent(msg));
}

</script>

</body>
</html>
