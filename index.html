<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,textarea{
width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

label{
display:block;
margin-top:14px;
margin-bottom:8px;
font-weight:600;
color:#4b3621;
}

button{cursor:pointer;}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
padding:12px;
border-radius:8px;
}

.main-btn:hover{
background:#2f2215;
}

#listaPizze{
max-height:320px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:12px;
margin-top:10px;
}

.pizza-item{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:white;
}

.pizza-item:hover{background:#f8f8f8;}

.pizza-item.active{
background:#e8f0fe;
border-left:4px solid #1a73e8;
}

.pizza-nome{font-weight:bold;color:#4b3621;}
.pizza-prezzo{color:#1a73e8;font-weight:bold;}

.modalita-box{
display:flex;
gap:10px;
margin-top:10px;
}

.modalita-btn{
flex:1;
background:#f1f1f1;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
}

.modalita-btn.active{
background:#4b3621;
color:white;
}

.pizza-ingredienti{
font-size:13px;
color:#666;
margin:4px 0;
line-height:1.4;
}

#previewOrdine{
margin-top:15px;
padding:12px;
background:#f7f7f7;
border-radius:10px;
font-size:14px;
line-height:1.4;
}

.chip{
padding:8px 12px;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
display:inline-block;
margin:4px;
}

.chip.active{
background:#4b3621;
color:white;
}

.aggiunte-box{
background:#f7f7f7;
padding:10px;
border-radius:10px;
margin-top:10px;
display:flex;
justify-content:space-between;
align-items:center;
}

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">

<h3>Dati cliente</h3>

<label>Nominativo *</label>
<input type="text" id="nome">

<label>Telefono *</label>
<input type="text" id="telefonoUtente">

<div class="modalita-box">

<button class="modalita-btn active" id="btnRitiro"
onclick="selezionaModalita('Ritiro')">🏠 Ritiro</button>

<button class="modalita-btn" id="btnConsegna"
onclick="selezionaModalita('Consegna a domicilio')">🛵 Consegna</button>

</div>

<input type="text" id="indirizzo"
placeholder="Indirizzo"
style="display:none;">

</div>

<!-- PIZZE -->
<div class="box">

<h3>CATEGORIA PIZZE</h3>
<select id="filtroCategoria" onchange="filtraPizze()">
<option value="Tutte">Tutte</option>
</select>

<h3>MENU PIZZE</h3>
<div id="listaPizze"></div>

<h4 id="labelEsclusioni" style="display:none;">Esclusioni:</h4>
<div id="esclusioniChips"></div>

<label>Formato</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1">

<h4>Aggiunte</h4>
<select id="aggiunteSelect"></select>

<div id="listaAggiunte"></div>

<textarea id="noteAggiunte" style="display:none"></textarea>

<div id="previewOrdine" style="display:none;">
<b>Anteprima:</b>
<div id="previewTesto"></div>
</div>

<button class="main-btn" onclick="aggiungiPizza()">
Aggiungi all'ordine
</button>

</div>

<!-- ORDINE -->
<div class="box">

<h3>Riepilogo</h3>
<div id="listaOrdine"></div>

</div>

</div>

<script>

const sheetUrl="https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu={};
let ordine=[];
let pizzaSelezionata=null;
let aggiunteSelezionate=[];
let tuttePizze=[];

let modalitaOrdine="Ritiro";

const listaPizze=document.getElementById("listaPizze");

/* MENU */
async function caricaMenu(){

const res=await fetch(sheetUrl);
const data=await res.text();

const righe=data.split("\n").slice(1);
const cats=new Set();

righe.forEach(r=>{
if(!r.trim()) return;

const [cat,nome,ing,pn,pf]=r.split(";");

menu[nome]={categoria:cat,ingredienti:ing,pn:+pn,pf:+pf};

tuttePizze.push(nome);
cats.add(cat);
});

caricaCategorie([...cats]);
renderPizze(tuttePizze);
}

window.onload=caricaMenu;

function caricaCategorie(cats){
const sel=document.getElementById("filtroCategoria");
cats.forEach(c=>{
let o=document.createElement("option");
o.value=c;o.textContent=c;
sel.appendChild(o);
});
}

function filtraPizze(){
const cat=document.getElementById("filtroCategoria").value;
renderPizze(cat==="Tutte"?tuttePizze:tuttePizze.filter(p=>menu[p].categoria===cat));
}

/* RENDER */
function renderPizze(list){

listaPizze.innerHTML="";

list.forEach(p=>{
const div=document.createElement("div");
div.className="pizza-item";

div.innerHTML=`
<div class="pizza-nome">${p}</div>
<div class="pizza-ingredienti">${menu[p].ingredienti}</div>
<div class="pizza-prezzo">€${menu[p].pn}</div>
`;

div.onclick=()=>selezionaPizza(p,div);
listaPizze.appendChild(div);
});
}

function selezionaPizza(p,el){

pizzaSelezionata=p;

document.querySelectorAll(".pizza-item").forEach(x=>x.classList.remove("active"));
el.classList.add("active");

generaEsclusioni(p);
}

function generaEsclusioni(p){

const div=document.getElementById("esclusioniChips");
div.innerHTML="";

menu[p].ingredienti.split(",").forEach(i=>{
if(!i.trim()) return;

const c=document.createElement("div");
c.className="chip";
c.textContent=i;
c.onclick=()=>c.classList.toggle("active");
div.appendChild(c);
});
}

/* AGGIUNGI */
function aggiungiPizza(){

if(!pizzaSelezionata) return alert("Seleziona pizza");

const q=+document.getElementById("quantita").value;

let extras=[];

document.querySelectorAll("#esclusioniChips .chip.active")
.forEach(c=>extras.push("- "+c.textContent));

aggiunteSelezionate.forEach(a=>extras.push("+ "+a));

ordine.push({
pizza:pizzaSelezionata,
quantita:q,
extras:[...extras]
});

/* RESET COMPLETO */
aggiunteSelezionate=[];
pizzaSelezionata=null;

document.getElementById("listaAggiunte").innerHTML="";
document.getElementById("esclusioniChips").innerHTML="";
document.getElementById("previewOrdine").style.display="none";

aggiorna();
}

function aggiorna(){

const div=document.getElementById("listaOrdine");
div.innerHTML="";

ordine.forEach(o=>{
div.innerHTML+=`
<div class="aggiunte-box">
<div>
<b>${o.pizza}</b><br>
x${o.quantita}<br>
${o.extras.map(e=>e+"<br>").join("")}
</div>
</div>`;
});
}

</script>

</body>
</html>
