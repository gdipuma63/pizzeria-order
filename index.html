<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.main-btn:hover{
background:#2f2215;
}

#ingredienti{
margin-top:12px;
padding:14px;
font-size:16px;
line-height:1.4;
}

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

@media (max-width:600px){
.rimuovi-btn{ width:100%; }
}

.aggiunte-box{
margin-top:10px;
padding:10px;
background:#f7f7f7;
border-radius:10px;
}

#esclusioniChips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:4px;
margin-bottom:25px;
}

.chip{
padding:8px 12px;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
font-size:14px;
background:#fff;
user-select:none;
transition:0.2s;
}

.chip:hover{
border-color:#4b3621;
}

.chip.active{
background:#e8f0fe;
color:#1a73e8;
border-color:#1a73e8;
font-weight:bold;
}

#listaPizze{
max-height:320px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:12px;
margin-top:10px;
}

.pizza-item{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:white;
line-height:1.3;
transition:0.2s;
}

.pizza-item:hover{
background:#f8f8f8;
}

.pizza-item.active{
background:#e8f0fe;
border-left:4px solid #1a73e8;
}

.pizza-nome{
font-weight:bold;
font-size:16px;
color:#4b3621;
}

.pizza-ingredienti{
font-size:13px;
color:#666;
margin-top:4px;
}

.pizza-prezzo{
font-size:14px;
font-weight:bold;
margin-top:6px;
color:#1a73e8;
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">
<h3>Dati cliente</h3>
<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefonoUtente" placeholder="Telefono">
</div>

<!-- PIZZA -->
<div class="box">

<h3>🍕 Seleziona filtro categoria</h3>
<select id="filtroCategoria" onchange="filtraPizze()">
<option value="Tutte">Tutte le categorie</option>
</select>

<h3>🍕 Seleziona pizza</h3>
<div id="listaPizze"></div>
<div id="ingredienti"></div>

<h4 id="labelEsclusioni" style="display:none;">
Seleziona ingredienti da eliminare:
</h4>
<div id="esclusioniChips"></div>

<label>Formato pizza</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1" min="1">

<h4>Seleziona aggiunte</h4>
<select id="aggiunteSelect"></select>
<button class="main-btn" onclick="aggiungiExtra()">➕ Aggiungi aggiunta</button>

<div id="listaAggiunte"></div>

<h5>Specificare verdure / salumi</h5>
<textarea id="noteAggiunte" style="display:none"></textarea>

<button class="main-btn" onclick="aggiungiPizza()">
Aggiungi all'ordine
</button>

</div>

<!-- RIEPILOGO -->
<div class="box">

<h3>🧾 Riepilogo ordine</h3>
<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">
Invia ordine su WhatsApp
</button>

</div>

</div>

<script>

const sheetUrl = "https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu = {};
let ordine = [];
let aggiunteSelezionate = [];
let pizzaSelezionata = null;

const listaPizze = document.getElementById("listaPizze");
const ingredientiDiv = document.getElementById("ingredienti");

let tuttePizze = [];

/* ================= MENU ================= */

async function caricaMenu(){

const res = await fetch(sheetUrl);
const data = await res.text();

const righe = data.split("\n").slice(1);

menu = {};
tuttePizze = [];

const categorieSet = new Set();

righe.forEach(r => {
if(!r.trim()) return;

const [cat, nome, ing, pn, pf] = r.split(";").map(x => x.trim());

menu[nome] = {
categoria: cat,
ingredienti: ing || "",
pn: parseFloat(pn) || 0,
pf: parseFloat(pf) || 0
};

tuttePizze.push(nome);
categorieSet.add(cat);
});

caricaCategorie([...categorieSet]);
renderPizze(tuttePizze);
caricaAggiunteSelect();
}

window.onload = caricaMenu;

/* ================= CATEGORIE ================= */

function caricaCategorie(categorie){
const sel = document.getElementById("filtroCategoria");
categorie.forEach(c=>{
const opt = document.createElement("option");
opt.value = c;
opt.textContent = c;
sel.appendChild(opt);
});
}

function filtraPizze(){
const cat = document.getElementById("filtroCategoria").value;

if(cat === "Tutte"){
renderPizze(tuttePizze);
return;
}

const filtrate = tuttePizze.filter(p => menu[p].categoria === cat);
renderPizze(filtrate);
}

/* ================= RENDER PIZZE ================= */

function renderPizze(lista){

listaPizze.innerHTML = "";

lista.forEach(p => {

const pfValido = menu[p].pf > 0;

const div = document.createElement("div");
div.className = "pizza-item";

div.innerHTML = `
<div class="pizza-nome">${p}</div>
<div class="pizza-ingredienti">${menu[p].ingredienti}</div>
<div class="pizza-prezzo">
${pfValido ? `Normale €${menu[p].pn} • Familiare €${menu[p].pf}` : `€${menu[p].pn}`}
</div>
`;

div.onclick = () => selezionaPizza(p, div);
listaPizze.appendChild(div);
});
}

/* ================= SELEZIONE PIZZA ================= */

function selezionaPizza(p, elemento){

pizzaSelezionata = p;

document.querySelectorAll(".pizza-item")
.forEach(el => el.classList.remove("active"));

elemento.classList.add("active");

ingredientiDiv.innerHTML = `<b>Ingredienti:</b> ${menu[p].ingredienti}`;

generaEsclusioni(p);
document.getElementById("labelEsclusioni").style.display = "block";

const formato = document.getElementById("formatoPizza");
formato.innerHTML = "";

if(menu[p].pf > 0){
formato.innerHTML = `
<option>Normale</option>
<option>Familiare</option>
`;
}else{
formato.innerHTML = `<option>Normale</option>`;
}
}

/* ================= ESCLUSIONI ================= */

function generaEsclusioni(pizza){

const div = document.getElementById("esclusioniChips");
div.innerHTML = "";

menu[pizza].ingredienti
.split(",")
.map(x => x.trim())
.filter(x => x)
.forEach(i => {

const chip = document.createElement("div");
chip.className = "chip";
chip.textContent = i;
chip.onclick = () => chip.classList.toggle("active");
div.appendChild(chip);

});
}

/* ================= AGGIUNTE ================= */

const aggiunte = [
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2},
{nome:"Verdure",p:1,pf:2},
{nome:"Salumi",p:1.5,pf:3},
{nome:"Funghi",p:1.5,pf:3},
{nome:"Bufala",p:2,pf:3.5},
{nome:"Porcini",p:2,pf:3.5}
];

function caricaAggiunteSelect(){

const sel = document.getElementById("aggiunteSelect");

sel.innerHTML = '<option value="">Seleziona</option>';

aggiunte.forEach(a=>{
sel.innerHTML += `
<option value="${a.nome}">
${a.nome} (€${a.p})
</option>`;
});

}

/* ================= AGGIUNGI EXTRA ================= */

function aggiungiExtra(){

const sel = document.getElementById("aggiunteSelect");
const val = sel.value;
if(!val) return;

aggiunteSelezionate.push(val);
sel.value = "";

if(val === "Verdure" || val === "Salumi"){
document.getElementById("noteAggiunte").style.display = "block";
}else{
document.getElementById("noteAggiunte").style.display = "none";
document.getElementById("noteAggiunte").value = "";
}

renderAggiunte();
}

/* ================= RENDER ================= */

function renderAggiunte(){

const div = document.getElementById("listaAggiunte");
div.innerHTML = "";

/* 🔴 FIX: evita rendering inutile se vuoto */
if(aggiunteSelezionate.length === 0) return;

aggiunteSelezionate.forEach((a,i)=>{
div.innerHTML += `
<div class="aggiunte-box">
+ ${a}
<button onclick="rimuoviAgg(${i})">❌</button>
</div>`;
});
}

/* ================= AGGIUNGI PIZZA ================= */

function aggiungiPizza(){

if(!pizzaSelezionata) return;

const q = parseInt(document.getElementById("quantita").value);
const formato = document.getElementById("formatoPizza").value;

const base = (formato === "Familiare")
? menu[pizzaSelezionata].pf
: menu[pizzaSelezionata].pn;

let listaAgg = [];

/* ESCLUSIONI */
document.querySelectorAll("#esclusioniChips .chip.active")
.forEach(c => listaAgg.push("- " + c.textContent));

/* AGGIUNTE (🔴 FIX MANCANTE) */
aggiunteSelezionate.forEach(a=>{
listaAgg.push("+ " + a);
});

/* NOTE AGGIUNTE */
if(document.getElementById("noteAggiunte").value.trim()){
listaAgg.push("nota: " + document.getElementById("noteAggiunte").value);
}

let extraTotale = 0;

aggiunteSelezionate.forEach(a => {
const add = aggiunte.find(x => x.nome === a);
if(add){
extraTotale += (formato === "Familiare") ? add.pf : add.p;
}
});

const totale = (base * q) + (extraTotale * q);

ordine.push({
pizza:pizzaSelezionata,
formato,
quantita:q,
totale,
aggiunte:listaAgg
});

aggiorna();

/* RESET */
aggiunteSelezionate = [];
renderAggiunte();

pizzaSelezionata = null;

document.querySelectorAll(".pizza-item")
.forEach(el => el.classList.remove("active"));

document.getElementById("ingredienti").innerHTML = "";
document.getElementById("esclusioniChips").innerHTML = "";
document.getElementById("labelEsclusioni").style.display = "none";
document.getElementById("quantita").value = 1;

document.getElementById("noteAggiunte").value = "";
document.getElementById("noteAggiunte").style.display = "none";
}

/* ================= RIEPILOGO ================= */

function aggiorna(){

let div = document.getElementById("listaOrdine");
div.innerHTML = "";

let tot = 0;

ordine.forEach((o,i)=>{
tot += o.totale;

div.innerHTML += `
<div>
<b>${o.pizza} x${o.quantita} - €${o.totale.toFixed(2)}</b><br>
`;

o.aggiunte.forEach(a=>{
div.innerHTML += `${a}<br>`;
});

div.innerHTML += `
<button class="rimuovi-btn" onclick="ordine.splice(${i},1);aggiorna();">❌</button>
<hr>
</div>`;
});

div.innerHTML += `<h3>Totale: €${tot.toFixed(2)}</h3>`;
}

/* ================= WHATSAPP ================= */

function inviaOrdine(){

let msg = "🍕 ORDINE\n\n";

ordine.forEach(o=>{
msg += `${o.pizza} x${o.quantita} - €${o.totale}\n`;
o.aggiunte.forEach(a=> msg += `+ ${a}\n`);
msg += "\n";
});

window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}

</script>

</body>
</html>
