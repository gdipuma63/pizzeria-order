<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.main-btn:hover{
background:#2f2215;
}

#ingredienti{
margin-top:12px;
padding:14px;
font-size:16px;
}

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.modalita-box{
display:flex;
gap:10px;
}

.modalita-btn{
flex:1;
background:#f1f1f1;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.modalita-btn.active{
background:#4b3621;
color:white;
}

#listaPizze{
max-height:300px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:10px;
margin-top:10px;
}

.pizza-item{
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.pizza-item.active{
background:#e8f0fe;
}

.chip{
display:inline-block;
padding:6px 10px;
margin:4px;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
}

.chip.active{
background:#4b3621;
color:white;
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">

<h3>Dati cliente</h3>

<input type="text" id="nome" placeholder="Nominativo">
<input type="text" id="telefonoUtente" placeholder="Telefono">

<h4>Modalità consegna</h4>

<div class="modalita-box">
<button id="btnRitiro" class="modalita-btn active" onclick="selezionaModalita('Ritiro')">Ritiro</button>
<button id="btnConsegna" class="modalita-btn" onclick="selezionaModalita('Consegna')">Consegna</button>
</div>

<input id="indirizzo" placeholder="Indirizzo" style="display:none;">
<button id="btnGeo" class="main-btn" style="display:none;" onclick="usaGeolocalizzazione()">📍 Usa posizione</button>

</div>

<!-- MENU -->
<div class="box">

<h3>Menu pizze</h3>

<select id="filtroCategoria" onchange="filtraPizze()">
<option value="Tutte">Tutte</option>
</select>

<div id="listaPizze"></div>
<div id="ingredienti"></div>

<h4 id="labelEsclusioni" style="display:none;">Esclusioni</h4>
<div id="esclusioniChips"></div>

<label>Formato</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1">

<h4>Aggiunte</h4>
<select id="aggiunteSelect"></select>
<button class="main-btn" onclick="aggiungiExtra()">➕ Aggiungi</button>

<div id="listaAggiunte"></div>

<button class="main-btn" onclick="aggiungiPizza()">Aggiungi ordine</button>

</div>

<!-- RIEPILOGO -->
<div class="box">

<h3>Ordine</h3>
<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">Invia WhatsApp</button>

</div>

</div>

<script>

const sheetUrl="https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu={},ordine=[],pizzaSelezionata=null,aggiunteSelezionate=[],modalita="Ritiro",tuttePizze=[];

const listaPizze=document.getElementById("listaPizze");
const ingredientiDiv=document.getElementById("ingredienti");

/* MODALITÀ */
function selezionaModalita(tipo){

modalita=tipo;

document.getElementById("btnRitiro").classList.remove("active");
document.getElementById("btnConsegna").classList.remove("active");

if(tipo==="Ritiro"){
document.getElementById("btnRitiro").classList.add("active");
document.getElementById("indirizzo").style.display="none";
document.getElementById("btnGeo").style.display="none";
}

if(tipo==="Consegna"){
document.getElementById("btnConsegna").classList.add("active");
document.getElementById("indirizzo").style.display="block";
document.getElementById("btnGeo").style.display="block";
}

}

/* MENU */
async function caricaMenu(){

const res=await fetch(sheetUrl);
const data=await res.text();

const righe=data.split("\n").slice(1);

const catSet=new Set();

righe.forEach(r=>{

if(!r.trim())return;

const[cat,nome,ing,pn,pf]=r.split(";");

menu[nome]={categoria:cat,ingredienti:ing,pn:+pn,pf:+pf};

tuttePizze.push(nome);
catSet.add(cat);

});

caricaCategorie([...catSet]);
renderPizze(tuttePizze);
caricaAggiunteSelect();

}

window.onload=caricaMenu;

/* CATEGORIE */
function caricaCategorie(cat){

const sel=document.getElementById("filtroCategoria");

cat.forEach(c=>{

const opt=document.createElement("option");
opt.value=c;
opt.textContent=c;
sel.appendChild(opt);

});

}

function filtraPizze(){

const c=document.getElementById("filtroCategoria").value;

if(c==="Tutte")return renderPizze(tuttePizze);

renderPizze(tuttePizze.filter(p=>menu[p].categoria===c));

}

/* RENDER */
function renderPizze(lista){

listaPizze.innerHTML="";

lista.forEach(p=>{

const div=document.createElement("div");
div.className="pizza-item";

div.innerHTML=`<b>${p}</b><br>${menu[p].ingredienti}`;

div.onclick=()=>selezionaPizza(p,div);

listaPizze.appendChild(div);

});

}

/* PIZZA */
function selezionaPizza(p,el){

pizzaSelezionata=p;

document.querySelectorAll(".pizza-item").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

ingredientiDiv.innerHTML=menu[p].ingredienti;

/* ESCLUSIONI */
const div=document.getElementById("esclusioniChips");
div.innerHTML="";

menu[p].ingredienti.split(",").forEach(i=>{

if(!i.trim())return;

const chip=document.createElement("div");
chip.className="chip";
chip.textContent=i;

chip.onclick=()=>chip.classList.toggle("active");

div.appendChild(chip);

});

/* FORMATO */
const f=document.getElementById("formatoPizza");
f.innerHTML="";

if(menu[p].pf>0){
f.innerHTML=`<option>Normale</option><option>Familiare</option>`;
}else{
f.innerHTML=`<option>Normale</option>`;
}

}

/* AGGIUNTE */
const aggiunte=[
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2}
];

function caricaAggiunteSelect(){

const sel=document.getElementById("aggiunteSelect");

sel.innerHTML='<option value="">Seleziona</option>';

aggiunte.forEach(a=>{

sel.innerHTML+=`<option value="${a.nome}">${a.nome}</option>`;

});

}

function aggiungiExtra(){

const v=document.getElementById("aggiunteSelect").value;
if(!v)return;

aggiunteSelezionate.push(v);
renderAggiunte();

}

function renderAggiunte(){

const div=document.getElementById("listaAggiunte");
div.innerHTML="";

aggiunteSelezionate.forEach((a,i)=>{

div.innerHTML+=`
<div>${a} <button onclick="rimuoviAgg(${i})">❌</button></div>
`;

});

}

function rimuoviAgg(i){
aggiunteSelezionate.splice(i,1);
renderAggiunte();
}

/* GEO */
function usaGeolocalizzazione(){

navigator.geolocation.getCurrentPosition(async p=>{

const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.coords.latitude}&lon=${p.coords.longitude}`);
const d=await r.json();

if(d.display_name){
document.getElementById("indirizzo").value=d.display_name;
}

});

}

/* ORDINE */
function aggiungiPizza(){

if(!pizzaSelezionata)return;

ordine.push({pizza:pizzaSelezionata});

aggiorna();

}

function aggiorna(){

const div=document.getElementById("listaOrdine");
div.innerHTML="";

ordine.forEach(o=>div.innerHTML+=`<div>${o.pizza}</div>`);

}

/* WHATSAPP */
function inviaOrdine(){

let msg="🍕 ORDINE\n";
msg+="Modalità: "+modalita+"\n";

if(modalita==="Consegna"){
msg+="Indirizzo: "+document.getElementById("indirizzo").value+"\n";
}

ordine.forEach(o=>msg+=o.pizza+"\n");

window.open("https://wa.me/?text="+encodeURIComponent(msg));

}

</script>

</body>
</html>
