<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.main-btn:hover{
background:#2f2215;
}

#ingredienti{
margin-top:12px;
padding:14px;
font-size:16px;
line-height:1.4;
}

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

@media (max-width:600px){
.rimuovi-btn{ width:100%; }
}

.aggiunte-box{
margin-top:10px;
padding:10px;
background:#f7f7f7;
border-radius:10px;
}

#esclusioniChips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:4px;
margin-bottom:25px;
}

.chip{
padding:8px 12px;
border:1px solid #ccc;
border-radius:20px;
cursor:pointer;
font-size:14px;
background:#fff;
}

.chip.active{
background:#e8f0fe;
color:#1a73e8;
border-color:#1a73e8;
font-weight:bold;
}

#listaPizze{
max-height:320px;
overflow-y:auto;
border:1px solid #ccc;
border-radius:12px;
margin-top:10px;
}

.pizza-item{
padding:12px;
border-bottom:1px solid #eee;
cursor:pointer;
background:white;
}

.pizza-item.active{
background:#e8f0fe;
border-left:4px solid #1a73e8;
}

.pizza-nome{
font-weight:bold;
color:#4b3621;
}

.modalita-box{
display:flex;
gap:10px;
margin-top:10px;
}

.modalita-btn{
flex:1;
background:#f1f1f1;
border:none;
padding:14px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.modalita-btn.active{
background:#4b3621;
color:white;
}

@media (max-width:600px){
.modalita-box{ flex-direction:column; }
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">

<h3>Dati cliente</h3>

<input type="text" id="nome" placeholder="Nominativo">
<input type="text" id="telefonoUtente" placeholder="Telefono">

<h4 style="text-align:center;">Modalità di consegna</h4>

<div class="modalita-box">

<button type="button"
class="modalita-btn active"
id="btnRitiro"
onclick="selezionaModalita('Ritiro')">🏠 Ritiro</button>

<button type="button"
class="modalita-btn"
id="btnConsegna"
onclick="selezionaModalita('Consegna a domicilio')">🛵 Consegna</button>

</div>

<input type="text" id="indirizzo"
placeholder="Indirizzo (solo consegna a domicilio)"
style="display:none;">

<button type="button"
class="main-btn"
id="btnGeo"
style="display:none;"
onclick="usaGeolocalizzazione()">📍 Usa posizione</button>

</div>

<!-- PIZZA -->
<div class="box">

<h3 style="text-align:center;">🍕 MENU</h3>

<select id="filtroCategoria" onchange="filtraPizze()">
<option value="Tutte">Tutte</option>
</select>

<div id="listaPizze"></div>
<div id="ingredienti"></div>

<h4 id="labelEsclusioni" style="display:none;">Esclusioni</h4>
<div id="esclusioniChips"></div>

<label>Formato</label>
<select id="formatoPizza"></select>

<label>Quantità</label>
<input type="number" id="quantita" value="1">

<h4>Aggiunte</h4>
<select id="aggiunteSelect"></select>
<button class="main-btn" onclick="aggiungiExtra()">➕ Aggiungi</button>

<div id="listaAggiunte"></div>

<textarea id="noteAggiunte" style="display:none"></textarea>

<button class="main-btn" onclick="aggiungiPizza()">Aggiungi ordine</button>

</div>

<!-- RIEPILOGO -->
<div class="box">

<h3>Riepilogo</h3>
<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">Invia WhatsApp</button>

</div>

</div>

<script>

const sheetUrl = "https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu = {};
let ordine = [];
let aggiunteSelezionate = [];
let pizzaSelezionata = null;
let modalitaOrdine = "Ritiro";

const listaPizze = document.getElementById("listaPizze");
const ingredientiDiv = document.getElementById("ingredienti");

let tuttePizze = [];

function selezionaModalita(tipo){

modalitaOrdine = tipo;

document.getElementById("btnRitiro").classList.remove("active");
document.getElementById("btnConsegna").classList.remove("active");

if(tipo === "Ritiro"){
document.getElementById("btnRitiro").classList.add("active");
document.getElementById("indirizzo").style.display = "none";
document.getElementById("btnGeo").style.display = "none";
document.getElementById("indirizzo").value = "";
}

if(tipo === "Consegna a domicilio"){
document.getElementById("btnConsegna").classList.add("active");
document.getElementById("indirizzo").style.display = "block";
document.getElementById("btnGeo").style.display = "block";
}

}

/* MENU */
async function caricaMenu(){

const res = await fetch(sheetUrl);
const data = await res.text();

const righe = data.split("\n").slice(1);

menu = {};
tuttePizze = [];

const categorieSet = new Set();

righe.forEach(r => {
if(!r.trim()) return;

const [cat,nome,ing,pn,pf] = r.split(";").map(x=>x.trim());

menu[nome]={categoria:cat,ingredienti:ing,pn:+pn,pf:+pf};

tuttePizze.push(nome);
categorieSet.add(cat);
});

caricaCategorie([...categorieSet]);
renderPizze(tuttePizze);
caricaAggiunteSelect();
}

window.onload = caricaMenu;

/* CATEGORIE */
function caricaCategorie(categorie){
const sel=document.getElementById("filtroCategoria");
categorie.forEach(c=>{
const opt=document.createElement("option");
opt.value=c;
opt.textContent=c;
sel.appendChild(opt);
});
}

function filtraPizze(){
const cat=document.getElementById("filtroCategoria").value;
if(cat==="Tutte") return renderPizze(tuttePizze);
renderPizze(tuttePizze.filter(p=>menu[p].categoria===cat));
}

/* RENDER */
function renderPizze(lista){

listaPizze.innerHTML="";

lista.forEach(p=>{

const div=document.createElement("div");
div.className="pizza-item";

div.innerHTML=`<b>${p}</b><br>${menu[p].ingredienti}`;

div.onclick=()=>selezionaPizza(p,div);

listaPizze.appendChild(div);

});
}

/* PIZZA */
function selezionaPizza(p,el){

pizzaSelezionata=p;

document.querySelectorAll(".pizza-item").forEach(e=>e.classList.remove("active"));
el.classList.add("active");

ingredientiDiv.innerHTML=menu[p].ingredienti;

}

/* AGGIUNTE */
function aggiungiExtra(){
const val=document.getElementById("aggiunteSelect").value;
if(!val) return;
aggiunteSelezionate.push(val);
renderAggiunte();
}

function renderAggiunte(){
const div=document.getElementById("listaAggiunte");
div.innerHTML="";
aggiunteSelezionate.forEach((a,i)=>{
div.innerHTML+=`<div class="aggiunte-box">${a}<button onclick="rimuoviAgg(${i})">❌</button></div>`;
});
}

function rimuoviAgg(i){
aggiunteSelezionate.splice(i,1);
renderAggiunte();
}

/* GEO */
function usaGeolocalizzazione(){

navigator.geolocation.getCurrentPosition(async pos=>{

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
const data=await res.json();

if(data.display_name){
document.getElementById("indirizzo").value=data.display_name;
}

});

}

/* ORDINE */
function aggiungiPizza(){

if(!pizzaSelezionata) return;

if(modalitaOrdine==="Consegna a domicilio"){
if(document.getElementById("indirizzo").value.trim()===""){
alert("Inserisci indirizzo");
return;
}
}

ordine.push({pizza:pizzaSelezionata});
aggiorna();

}

function aggiorna(){
let div=document.getElementById("listaOrdine");
div.innerHTML="";
ordine.forEach(o=>{
div.innerHTML+=`<div>${o.pizza}</div>`;
});
}

/* WHATSAPP */
function inviaOrdine(){

let msg="ORDINE\n";
msg+="Modalità: "+modalitaOrdine+"\n";

if(modalitaOrdine==="Consegna a domicilio"){
msg+="Indirizzo: "+document.getElementById("indirizzo").value+"\n";
}

ordine.forEach(o=>{
msg+=o.pizza+"\n";
});

window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);

}

</script>

</body>
</html>
