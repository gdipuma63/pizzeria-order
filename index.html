<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordina la tua pizza</title>

<style>

body{
font-family:Arial,sans-serif;
background:#d2b48c;
margin:0;
padding:0;
}

.header{
background:#4b3621;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
max-width:800px;
margin:auto;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input,select,button,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;
box-sizing:border-box;
}

.main-btn{
background:#4b3621;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

.main-btn:hover{
background:#2f2215;
}

#ingredienti{
margin-top:10px;
padding:10px;
background:#f2f2f2;
border-radius:8px;
}

/* ================= LISTA ORDINE ================= */

.rimuovi-btn{
background:#c0392b;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

hr{
margin:15px 0;
}

/* ================= MOBILE FIX ================= */

@media (max-width:600px){

.rimuovi-btn{
width:100%;
font-size:16px;
}

}

/* ================= AGGIUNTE CHECKBOX ================= */

.aggiunte-gruppo{
margin-bottom:15px;
padding:10px;
background:#f7f7f7;
border-radius:10px;
}

.aggiunte-gruppo label{
display:block;
margin:5px 0;
}

</style>
</head>

<body>

<div class="header">🍕 Ordina la tua pizza</div>

<div class="container">

<!-- CLIENTE -->
<div class="box">

<h3>Dati cliente</h3>

<input type="text" id="nome" placeholder="Nome">
<input type="text" id="telefonoUtente" placeholder="Telefono">

<select id="modalita">
<option value="">Modalità ordine</option>
<option>Consegna a domicilio</option>
<option>Ritiro in pizzeria</option>
</select>

<div id="indirizzoBox" style="display:none;">
<input type="text" id="indirizzo" placeholder="Indirizzo">
</div>

</div>

<!-- PIZZA -->
<div class="box">

<h3>🍕 Seleziona pizza</h3>

<select id="pizza">
<option>Caricamento menu...</option>
</select>

<div id="ingredienti"></div>

<label>Formato pizza</label>
<select id="formatoPizza">
<option value="Normale">Normale</option>
<option value="Familiare">Familiare</option>
</select>

<label>Quantità</label>
<input type="number" id="quantita" value="1" min="1">

<!-- AGGIUNTE -->
<h4>Aggiunte</h4>
<div id="aggiunteContainer"></div>

<h5>Note aggiuntive</h5>
<textarea id="noteAggiunte" placeholder="Scrivi richieste extra..."></textarea>

<!-- ESCLUSIONI -->
<h4>Esclusioni</h4>
<div id="modifiche">
<label><input type="checkbox" value="Senza mozzarella"> Senza mozzarella</label>
<label><input type="checkbox" value="Senza cipolla"> Senza cipolla</label>
<label><input type="checkbox" value="Senza pomodoro"> Senza pomodoro</label>
</div>

<button class="main-btn" onclick="aggiungiPizza()">
Aggiungi all'ordine
</button>

</div>

<!-- RIEPILOGO -->
<div class="box">

<h3>🧾 Riepilogo ordine</h3>

<div id="listaOrdine"></div>

<button class="main-btn" onclick="inviaOrdine()">
Invia ordine su WhatsApp
</button>

</div>

</div>

<script>

const sheetUrl="https://raw.githubusercontent.com/gdipuma63/pizzeria-order/refs/heads/main/menu.csv";

let menu={};
let ordine=[];
let aggiunteSelezionate=[];

const pizzaSelect=document.getElementById("pizza");
const ingredientiDiv=document.getElementById("ingredienti");
const formatoPizza=document.getElementById("formatoPizza");
const optionFamiliare=formatoPizza.querySelector('option[value="Familiare"]');

/* ================= MENU ================= */

async function caricaMenu(){

const res=await fetch(sheetUrl);
const data=await res.text();

const righe=data.split("\n").slice(1);

righe.forEach(r=>{

if(!r.trim())return;

const [cat,nome,ing,pn,pf]=r.split(";").map(x=>x.trim());

menu[nome]={
ingredienti:ing,
pn:parseFloat(pn)||0,
pf:parseFloat(pf)||0
};

});

pizzaSelect.innerHTML='<option value="">Seleziona pizza</option>';

for(let p in menu){

let pfValido=menu[p].pf>0;

pizzaSelect.innerHTML+=`
<option value="${p}">
${p} (${pfValido?
`Normale €${menu[p].pn} / Familiare €${menu[p].pf}`:
`€${menu[p].pn}`})
</option>`;
}

renderAggiunte();
}

window.onload=caricaMenu;

/* ================= AGGIUNTE ================= */

const aggiunte=[
{nome:"Patatine",p:1,pf:2},
{nome:"Wurstel",p:1,pf:2},
{nome:"Grana",p:1,pf:2},
{nome:"Ciliegino",p:1,pf:2},
{nome:"Verdure",p:1,pf:2},
{nome:"Crema Formaggi",p:1,pf:2},
{nome:"Salumi",p:1.5,pf:3},
{nome:"Salsiccia",p:1.5,pf:3},
{nome:"Funghi",p:1.5,pf:3},
{nome:"Bufala",p:2,pf:3.5},
{nome:"Porcini",p:2,pf:3.5},
{nome:"Tartufo",p:2,pf:3.5}
];

function renderAggiunte(){

const box=document.getElementById("aggiunteContainer");

aggiunte.forEach(a=>{

const div=document.createElement("div");
div.className="aggiunte-gruppo";

div.innerHTML=`
<label>
<input type="checkbox" value="${a.nome}" data-p="${a.p}" data-pf="${a.pf}">
${a.nome} (€${a.p} / €${a.pf})
</label>
`;

box.appendChild(div);

});
}

/* ================= AGGIUNGI ================= */

function aggiungiPizza(){

const p=pizzaSelect.value;
const q=parseInt(document.getElementById("quantita").value);
const formato=formatoPizza.value;

let base=formato==="Familiare"?menu[p].pf:menu[p].pn;

let extra=0;
let selezionate=[];

document.querySelectorAll("#aggiunteContainer input:checked").forEach(cb=>{
extra += formato==="Familiare"
? parseFloat(cb.dataset.pf)
: parseFloat(cb.dataset.p);

selezionate.push(cb.value);
});

document.querySelectorAll("#modifiche input:checked").forEach(cb=>{
selezionate.push(cb.value);
});

const totale=(base+extra)*q;

ordine.push({
pizza:p,
formato,
quantita:q,
totale,
aggiunte:selezionate,
note:document.getElementById("noteAggiunte").value||""
});

aggiorna();

document.getElementById("noteAggiunte").value="";
document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);

}

/* ================= RIEPILOGO ================= */

function aggiorna(){

let div=document.getElementById("listaOrdine");
div.innerHTML="";

let tot=0;

ordine.forEach((o,i)=>{

tot+=o.totale;

div.innerHTML+=`
<div>
<b>${o.pizza} (${o.formato}) x${o.quantita} - €${o.totale.toFixed(2)}</b><br>
`;

o.aggiunte.forEach(a=>{
div.innerHTML+=`+ ${a}<br>`;
});

if(o.note)div.innerHTML+=`Note: ${o.note}<br>`;

div.innerHTML+=`
<button class="rimuovi-btn" onclick="rimuovi(${i})">❌ Rimuovi</button>
<hr>
</div>
`;
});

div.innerHTML+=`<h3>Totale: €${tot.toFixed(2)}</h3>`;
}

function rimuovi(i){
ordine.splice(i,1);
aggiorna();
}

/* ================= WHATSAPP ================= */

function inviaOrdine(){

let msg="🍕 ORDINE\n\n";

ordine.forEach(o=>{
msg+=`${o.pizza} (${o.formato}) x${o.quantita} - €${o.totale}\n`;

o.aggiunte.forEach(a=>{
msg+=`+ ${a}\n`;
});

if(o.note)msg+=`Note: ${o.note}\n`;

msg+="\n";
});

window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
}

</script>

</body>
</html>
